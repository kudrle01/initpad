# Public control-plane profile. It deliberately does not include Gitea, MinIO,
# a CI runner, deployment targets, Caddy or the self-hosted update Supervisor.
# Database, object storage, edge/WAF and secrets are owned by the deployment
# environment. Validate a prepared environment with ./saas-check.sh.

name: initpad-saas

services:
  api:
    image: ${INITPAD_API_IMAGE:?set_digest_pinned_api_image}
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      INITPAD_EDITION: saas
      INITPAD_REGISTRATION_MODE: admin-provisioned
      INITPAD_FRONTEND_URL: ${INITPAD_PUBLIC_URL:?set the public HTTPS origin}
      INITPAD_PLATFORM_PUBLIC_URL: ${INITPAD_PUBLIC_URL:?set the public HTTPS origin}
      INITPAD_PLATFORM_INTERNAL_URL: ${INITPAD_PUBLIC_URL:?set the public HTTPS origin}
      INITPAD_SCM_WEBHOOK_URL: ${INITPAD_PUBLIC_URL:?set the public HTTPS origin}
      INITPAD_TRUST_PROXY_HOPS: ${INITPAD_TRUST_PROXY_HOPS:-1}
      INITPAD_COOKIE_SECURE: 'true'
      INITPAD_JWT_SECRET_FILE: /run/secrets/jwt_secret
      INITPAD_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      INITPAD_SMTP_HOST: ${INITPAD_SMTP_HOST:?set the SMTP hostname}
      INITPAD_SMTP_PORT: ${INITPAD_SMTP_PORT:-587}
      INITPAD_SMTP_SECURE: ${INITPAD_SMTP_SECURE:-false}
      INITPAD_SMTP_REQUIRE_TLS: 'true'
      INITPAD_SMTP_USERNAME: ${INITPAD_SMTP_USERNAME:?set the SMTP username}
      INITPAD_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      INITPAD_SMTP_FROM: ${INITPAD_SMTP_FROM:?set the sender address}
      INITPAD_SCM_WEBHOOK_TOKEN_FILE: /run/secrets/scm_webhook_token
      INITPAD_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      INITPAD_PLATFORM_VERSION: ${INITPAD_PLATFORM_VERSION:?set the deployed release version}
      INITPAD_UPDATE_REPOSITORY: ${INITPAD_UPDATE_REPOSITORY:-kudrle01/initpad}
      INITPAD_AGENT_UPDATE_CHANNEL: stable
      INITPAD_PLATFORM_UPDATE_CHANNEL: stable
      INITPAD_SIGSTORE_CACHE_DIR: /data/sigstore-js
      INITPAD_AGENT_IMAGE: ${INITPAD_AGENT_IMAGE:?set a digest-pinned Agent image}
      INITPAD_AGENT_RELEASE_VERSION: ${INITPAD_AGENT_RELEASE_VERSION:?set the Agent version}
      INITPAD_GITHUB_APP_ID: ${INITPAD_GITHUB_APP_ID:?inject the GitHub App id}
      INITPAD_GITHUB_CLIENT_ID: ${INITPAD_GITHUB_CLIENT_ID:?inject the GitHub OAuth client id}
      INITPAD_GITHUB_CLIENT_SECRET_FILE: /run/secrets/github_client_secret
      INITPAD_GITHUB_PRIVATE_KEY_FILE: /run/secrets/github_private_key
      INITPAD_GITHUB_WEBHOOK_SECRET_FILE: /run/secrets/github_webhook_secret
      INITPAD_GITHUB_APP_SLUG: ${INITPAD_GITHUB_APP_SLUG:?set the public GitHub App slug}
      INITPAD_GITHUB_CALLBACK_URL: ${INITPAD_PUBLIC_URL:?set the public HTTPS origin}/api/auth/github/callback
      INITPAD_ARTIFACT_S3_ENDPOINT: ${INITPAD_ARTIFACT_S3_ENDPOINT:-}
      INITPAD_ARTIFACT_S3_REGION: ${INITPAD_ARTIFACT_S3_REGION:-us-east-1}
      INITPAD_ARTIFACT_S3_BUCKET: ${INITPAD_ARTIFACT_S3_BUCKET:?set the private external bucket}
      INITPAD_ARTIFACT_S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      INITPAD_ARTIFACT_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      INITPAD_ARTIFACT_S3_FORCE_PATH_STYLE: ${INITPAD_ARTIFACT_S3_FORCE_PATH_STYLE:-false}
      INITPAD_ARTIFACT_PRESIGN_TTL_SECONDS: ${INITPAD_ARTIFACT_PRESIGN_TTL_SECONDS:-300}
      INITPAD_ARTIFACT_RETENTION_DAYS: ${INITPAD_ARTIFACT_RETENTION_DAYS:-30}
      INITPAD_TEMPLATES_DIR: /templates
      INITPAD_WORKSPACE_DIR: /data/workspace
    volumes:
      - api-data:/data
    secrets:
      - database_url
      - jwt_secret
      - encryption_key
      - smtp_password
      - scm_webhook_token
      - oidc_client_secret
      - github_client_secret
      - github_private_key
      - github_webhook_secret
      - s3_access_key_id
      - s3_secret_access_key
    networks: [control]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health/ready']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${INITPAD_API_MEMORY_LIMIT:-1g}
    cpus: ${INITPAD_API_CPU_LIMIT:-2.0}
    pids_limit: ${INITPAD_API_PIDS_LIMIT:-300}
    restart: unless-stopped

  web:
    image: ${INITPAD_WEB_IMAGE:?set_digest_pinned_web_image}
    ports:
      - '${INITPAD_WEB_BIND_ADDRESS:-127.0.0.1}:${INITPAD_WEB_PORT:-8080}:80'
    depends_on:
      api: { condition: service_healthy }
    networks: [control]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    restart: unless-stopped

volumes:
  api-data: {}

networks:
  control: {}

secrets:
  database_url:
    file: ${INITPAD_DATABASE_URL_FILE:?set the external PostgreSQL secret file}
  jwt_secret:
    file: ${INITPAD_JWT_SECRET_FILE:?set the JWT secret file}
  encryption_key:
    file: ${INITPAD_ENCRYPTION_KEY_FILE:?set the encryption key file}
  smtp_password:
    file: ${INITPAD_SMTP_PASSWORD_FILE:?set the SMTP password file}
  scm_webhook_token:
    file: ${INITPAD_SCM_WEBHOOK_TOKEN_FILE:?set the SCM webhook token file}
  oidc_client_secret:
    file: ${INITPAD_OIDC_CLIENT_SECRET_FILE:?set the OIDC client secret file}
  github_client_secret:
    file: ${INITPAD_GITHUB_CLIENT_SECRET_FILE:?set the GitHub client secret file}
  github_private_key:
    file: ${INITPAD_GITHUB_PRIVATE_KEY_FILE:?set the GitHub private key file}
  github_webhook_secret:
    file: ${INITPAD_GITHUB_WEBHOOK_SECRET_FILE:?set the GitHub webhook secret file}
  s3_access_key_id:
    file: ${INITPAD_ARTIFACT_S3_ACCESS_KEY_ID_FILE:?set the S3 access key id file}
  s3_secret_access_key:
    file: ${INITPAD_ARTIFACT_S3_SECRET_ACCESS_KEY_FILE:?set the S3 secret access key file}
