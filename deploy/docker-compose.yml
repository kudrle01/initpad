# InitPad — full containerized stack (one-command install, see install.sh).
#
# Local install:   ./install.sh              → http://localhost:8080
# Server install:  set INITPAD_DOMAIN + INITPAD_GIT_DOMAIN in .env, then
#                  ./install.sh              → https://<domain> via Caddy
#
# Do not run this stack and the infra/ development stack at the same time.

name: initpad

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: initpad
      POSTGRES_PASSWORD: ${INITPAD_DB_PASSWORD:-initpad}
      POSTGRES_DB: initpad
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U initpad']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [platform]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200
    restart: unless-stopped

  # Durable object storage for verified build artifacts (ADR-059). The local
  # demo runs a pinned legacy MinIO release (S3-compatible); production
  # should point the API's
  # INITPAD_ARTIFACT_S3_* variables at real S3 and can drop this service.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${INITPAD_ARTIFACT_S3_ACCESS_KEY_ID:-initpad}
      MINIO_ROOT_PASSWORD: ${INITPAD_ARTIFACT_S3_SECRET_ACCESS_KEY:-initpad-artifacts}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/ready']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [platform]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    restart: unless-stopped

  # One-shot: wait for MinIO, create the PRIVATE artifact bucket, then exit.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio: { condition: service_healthy }
    environment:
      ARTIFACT_BUCKET: ${INITPAD_ARTIFACT_S3_BUCKET:-initpad-artifacts}
      MC_USER: ${INITPAD_ARTIFACT_S3_ACCESS_KEY_ID:-initpad}
      MC_PASS: ${INITPAD_ARTIFACT_S3_SECRET_ACCESS_KEY:-initpad-artifacts}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 "$$MC_USER" "$$MC_PASS"; do
          echo "waiting for minio..."; sleep 2;
        done
        mc mb --ignore-existing "local/$$ARTIFACT_BUCKET"
        # Ensure the bucket is never publicly readable.
        mc anonymous set none "local/$$ARTIFACT_BUCKET"
        echo "artifact bucket ready: $$ARTIFACT_BUCKET"
    networks: [platform]
    restart: 'no'

  gitea:
    image: gitea/gitea:1.22@sha256:538658de667c5d098a274f2f63aa6ec891d88f670cdd5282cf27221ba747dda4
    environment:
      # INSTALL_LOCK skips the web install wizard — the instance is configured
      # entirely from here and from install.sh (no manual clicking).
      GITEA__security__INSTALL_LOCK: 'true'
      GITEA__server__ROOT_URL: ${INITPAD_GITEA_PUBLIC_URL:-http://gitea.localhost:3001/}
      GITEA__actions__ENABLED: 'true'
      # SSO: sign-in through the platform (OIDC) auto-links to an existing
      # account by e-mail; unknown e-mails get a new account.
      GITEA__oauth2_client__ACCOUNT_LINKING: auto
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: 'true'
      GITEA__oauth2_client__USERNAME: nickname
      GITEA__service__DISABLE_REGISTRATION: 'true'
      GITEA__webhook__ALLOWED_HOST_LIST: 'api'
    ports:
      # Must stay published on the host: the host Docker daemon pushes/pulls
      # registry images through this port (build once, deploy many).
      - '${INITPAD_GITEA_HTTP_PORT:-3001}:3000'
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/api/healthz']
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [platform]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 300
    restart: unless-stopped

  api:
    image: ${INITPAD_API_IMAGE:-initpad-api:source}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://initpad:${INITPAD_DB_PASSWORD:-initpad}@postgres:5432/initpad
      # Browser-facing vs server-to-server addresses (split horizon).
      INITPAD_GITEA_URL: ${INITPAD_GITEA_PUBLIC_URL:-http://gitea.localhost:3001}
      INITPAD_GITEA_INTERNAL_URL: http://gitea:3000
      INITPAD_GITEA_USER: ${INITPAD_BOT_USER:-initpad-bot}
      INITPAD_GITEA_TOKEN: ${INITPAD_GITEA_TOKEN:-}
      INITPAD_FRONTEND_URL: ${INITPAD_PUBLIC_URL:-http://localhost:8080}
      INITPAD_PLATFORM_PUBLIC_URL: ${INITPAD_PUBLIC_URL:-http://localhost:8080}
      INITPAD_TRUST_PROXY_HOPS: ${INITPAD_TRUST_PROXY_HOPS:-1}
      INITPAD_JWT_SECRET: ${INITPAD_JWT_SECRET:?run install.sh to generate secrets}
      INITPAD_ENCRYPTION_KEY: ${INITPAD_ENCRYPTION_KEY:?run install.sh to generate secrets}
      INITPAD_SCM_WEBHOOK_TOKEN: ${INITPAD_SCM_WEBHOOK_TOKEN:?run install.sh to generate secrets}
      INITPAD_SCM_WEBHOOK_URL: http://api:3000
      INITPAD_REGISTRATION_MODE: ${INITPAD_REGISTRATION_MODE:-open}
      INITPAD_EDITION: ${INITPAD_EDITION:-self-hosted}
      INITPAD_PLATFORM_VERSION: ${INITPAD_PLATFORM_VERSION:-0.2.7}
      INITPAD_UPDATE_REPOSITORY: ${INITPAD_UPDATE_REPOSITORY:-kudrle01/initpad}
      INITPAD_SIGSTORE_CACHE_DIR: /data/sigstore-js
      INITPAD_SUPERVISOR_URL: http://supervisor:7070
      INITPAD_SUPERVISOR_SHARED_SECRET: ${INITPAD_SUPERVISOR_SHARED_SECRET:?run install.sh to generate secrets}
      # Enables the public, checksum-bound Agent installer UX only when it is
      # an immutable digest reference. The enrollment token is never embedded.
      INITPAD_AGENT_IMAGE: ${INITPAD_AGENT_IMAGE:-}
      INITPAD_AGENT_RELEASE_VERSION: ${INITPAD_AGENT_RELEASE_VERSION:-}
      # GitHub App (hosted edition, optional; inert when unset).
      INITPAD_GITHUB_APP_ID: ${INITPAD_GITHUB_APP_ID:-}
      INITPAD_GITHUB_CLIENT_ID: ${INITPAD_GITHUB_CLIENT_ID:-}
      INITPAD_GITHUB_CLIENT_SECRET: ${INITPAD_GITHUB_CLIENT_SECRET:-}
      INITPAD_GITHUB_PRIVATE_KEY: ${INITPAD_GITHUB_PRIVATE_KEY:-}
      INITPAD_GITHUB_WEBHOOK_SECRET: ${INITPAD_GITHUB_WEBHOOK_SECRET:-}
      INITPAD_GITHUB_APP_SLUG: ${INITPAD_GITHUB_APP_SLUG:-}
      INITPAD_GITHUB_CALLBACK_URL: ${INITPAD_GITHUB_CALLBACK_URL:-}
      # Addresses of deployed apps (browser) and health checks (from inside
      # this container → host-published ports via host.docker.internal).
      # Built-in app links normally derive their host from INITPAD_PUBLIC_URL.
      # Only set the override when apps intentionally use a different hostname.
      INITPAD_DEPLOY_PUBLIC_HOST: ${INITPAD_DEPLOY_PUBLIC_HOST:-}
      # Backward-compatible fallback for development environments without a
      # configured public URL; ignored by this Compose profile in normal use.
      INITPAD_PUBLIC_HOST: ${INITPAD_PUBLIC_HOST:-}
      INITPAD_DEPLOY_HEALTH_HOST: host.docker.internal
      INITPAD_DEPLOY_BIND_ADDRESS: ${INITPAD_DEPLOY_BIND_ADDRESS:-127.0.0.1}
      INITPAD_DEPLOY_MEMORY_MB: ${INITPAD_DEPLOY_MEMORY_MB:-512}
      INITPAD_DEPLOY_CPU: ${INITPAD_DEPLOY_CPU:-1}
      INITPAD_DEPLOY_PIDS_LIMIT: ${INITPAD_DEPLOY_PIDS_LIMIT:-256}
      # Registry as seen by the host deployment daemon. CI builds inside an
      # isolated daemon and pushes the resulting image to this registry.
      INITPAD_REGISTRY_HOST: ${INITPAD_REGISTRY_HOST:-127.0.0.1:3001}
      INITPAD_CI_REGISTRY_HOST: ${INITPAD_CI_REGISTRY_HOST:-host.docker.internal:3001}
      INITPAD_PLATFORM_INTERNAL_URL: http://host.docker.internal:${INITPAD_WEB_PORT:-8080}
      # Simulated deployment targets (service names inside the compose net).
      # The credentials MUST match how fake-vps/fake-sftp were created below,
      # otherwise the API authenticates with the wrong password.
      INITPAD_SSH_HOST: fake-vps
      INITPAD_SSH_PORT: '2222'
      INITPAD_SSH_USER: deploy
      INITPAD_SSH_PASSWORD: ${INITPAD_SSH_PASSWORD:-deploy}
      INITPAD_SFTP_HOST: fake-sftp
      INITPAD_SFTP_PORT: '22'
      INITPAD_SFTP_USER: deploy
      INITPAD_SFTP_PASSWORD: ${INITPAD_SFTP_PASSWORD:-deploy}
      INITPAD_SFTP_INTERNAL_URL: http://static-web
      # SSO: Gitea (server) calls the API by service name; the browser goes
      # through the web origin (nginx proxies /api → api:3000).
      INITPAD_OIDC_ISSUER: http://api:3000/api
      INITPAD_OIDC_PUBLIC_URL: ${INITPAD_PUBLIC_URL:-http://localhost:8080}/api
      INITPAD_OIDC_CLIENT_SECRET: ${INITPAD_OIDC_CLIENT_SECRET:?run install.sh to generate secrets}
      INITPAD_OIDC_KEY_FILE: /data/oidc-key.pem
      INITPAD_TEMPLATES_DIR: /templates
      INITPAD_WORKSPACE_DIR: /data/workspace
      # Durable object storage for verified build artifacts (ADR-059). Local demo
      # points at the bundled MinIO; a cloud install sets these to a real S3
      # endpoint/bucket/credentials. The SaaS edition refuses to start unset.
      INITPAD_ARTIFACT_S3_ENDPOINT: ${INITPAD_ARTIFACT_S3_ENDPOINT:-http://minio:9000}
      INITPAD_ARTIFACT_S3_REGION: ${INITPAD_ARTIFACT_S3_REGION:-us-east-1}
      INITPAD_ARTIFACT_S3_BUCKET: ${INITPAD_ARTIFACT_S3_BUCKET:-initpad-artifacts}
      INITPAD_ARTIFACT_S3_ACCESS_KEY_ID: ${INITPAD_ARTIFACT_S3_ACCESS_KEY_ID:-initpad}
      INITPAD_ARTIFACT_S3_SECRET_ACCESS_KEY: ${INITPAD_ARTIFACT_S3_SECRET_ACCESS_KEY:-initpad-artifacts}
      INITPAD_ARTIFACT_S3_FORCE_PATH_STYLE: 'true'
    volumes:
      # The API drives deployments through the host Docker daemon. The :ro
      # suffix protects only the socket inode; Docker API access is inherently
      # host-privileged and is intentionally confined to the control plane.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../templates:/templates:ro
      - api-data:/data
    extra_hosts:
      # Works on Docker Desktop out of the box; this line makes it work on
      # plain Linux too (health checks of host-published app ports).
      - 'host.docker.internal:host-gateway'
    healthcheck:
      # busybox wget is available in node:alpine.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health/ready']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      gitea: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [platform, update-control, net-prod]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 300
    restart: unless-stopped

  web:
    image: ${INITPAD_WEB_IMAGE:-initpad-web:source}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - '${INITPAD_WEB_PORT:-8080}:80'
    depends_on: [api]
    networks: [platform]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
      - /tmp:size=8m
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    restart: unless-stopped

  # Minimal privileged updater (ADR-111). It has no published port and accepts
  # only short-lived HMAC-authenticated requests from the API. The Docker
  # socket is intentionally isolated here; browser input never becomes a
  # command, image reference or Compose fragment.
  supervisor:
    image: ${INITPAD_SUPERVISOR_IMAGE:-initpad-supervisor:source}
    build:
      context: ..
      dockerfile: apps/supervisor/Dockerfile
    container_name: initpad-supervisor
    environment:
      INITPAD_INSTALL_ROOT: ${INITPAD_INSTALL_ROOT:?run install.sh to configure the install root}
      INITPAD_PLATFORM_VERSION: ${INITPAD_PLATFORM_VERSION:-0.2.7}
      INITPAD_SUPERVISOR_CONTAINER_NAME: initpad-supervisor
      INITPAD_SUPERVISOR_SHARED_SECRET: ${INITPAD_SUPERVISOR_SHARED_SECRET:?run install.sh to generate secrets}
      INITPAD_UPDATE_REPOSITORY: ${INITPAD_UPDATE_REPOSITORY:-kudrle01/initpad}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - supervisor-data:/var/lib/initpad-supervisor
      # Host Compose commands read the same signed-release override so the
      # selected release survives maintenance and re-running install.sh.
      - ./.runtime/platform-update:/var/lib/initpad-supervisor/runtime
      - type: bind
        source: ${INITPAD_INSTALL_ROOT:?run install.sh to configure the install root}
        target: ${INITPAD_INSTALL_ROOT:?run install.sh to configure the install root}
        read_only: true
    networks: [update-control, release-egress]
    healthcheck:
      test: ['CMD', 'node', 'dist/cli.js', 'health']
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped

  # Dedicated rootless Docker daemon for untrusted CI jobs. It is privileged
  # only inside this container so rootless Docker can create namespaces; the
  # physical host socket and filesystem are never mounted into a workflow.
  # The outer cgroup is also the aggregate resource envelope for every nested
  # build container, so CI cannot starve the platform control plane.
  runner-docker:
    image: docker:27.5.1-dind-rootless@sha256:e2ac8e8f66ae21a060b0a8e3005c70f6ed9441aabf409434463d1f6eecd38026
    profiles: ['runner']
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ''
      DOCKER_HOST: tcp://127.0.0.1:2375
    command:
      - '--host=tcp://0.0.0.0:2375'
      - '--tls=false'
      # Only the same-host, non-public alias is HTTP. A configured public CI
      # registry still uses verified TLS and is not placed on this allow-list.
      - '--insecure-registry=host.docker.internal:${INITPAD_GITEA_HTTP_PORT:-3001}'
    volumes:
      - runner-docker-data:/home/rootless/.local/share/docker
    healthcheck:
      test: ['CMD', 'docker', 'info']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    extra_hosts:
      # Docker's generic host-gateway may resolve to the unrelated default
      # bridge (usually 172.17.0.1). This service only joins ci-control, whose
      # fixed gateway is the reachable outer host address used by CI jobs.
      # Gitea's auth challenge may use its canonical gitea.localhost realm.
      - 'host.docker.internal:172.31.250.1'
      - 'gitea.localhost:172.31.250.1'
    networks: [ci-control]
    mem_limit: ${INITPAD_RUNNER_MEMORY_LIMIT:-1536m}
    cpus: ${INITPAD_RUNNER_CPU_LIMIT:-1.0}
    pids_limit: ${INITPAD_RUNNER_PIDS_LIMIT:-512}
    restart: unless-stopped

  # Gitea Actions runner — registered automatically by install.sh.
  act_runner:
    image: gitea/act_runner:0.2.11@sha256:c57233403eff970945cfb8b13f0e622d2124f4dbc623af3e2c74f061d05e8f60
    profiles: ['runner']
    environment:
      # Persisted by act_runner and passed to checkout jobs. Keep it separate
      # from the browser URL: glibc treats *.localhost as IPv6 loopback.
      GITEA_INSTANCE_URL: ${INITPAD_GITEA_RUNNER_URL:-http://host.docker.internal:3001}
      GITEA_RUNNER_REGISTRATION_TOKEN: ${INITPAD_RUNNER_TOKEN:-}
      GITEA_RUNNER_NAME: initpad-runner
      GITEA_RUNNER_LABELS: 'ubuntu-latest:docker://catthehacker/ubuntu:act-latest@sha256:c58e2b364da03b0c804c7d660f2ecbedf2f221a382b9baa0b344b0144780ff43'
      CONFIG_FILE: /config.yaml
    volumes:
      - ./.runtime/act-runner-config.yaml:/config.yaml:ro
      - runner-data:/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      gitea: { condition: service_healthy }
      api: { condition: service_healthy }
      runner-docker: { condition: service_healthy }
    networks: [platform, ci-control]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped

  # --- simulated deployment targets (real protocols, stand-in containers) ---

  # Named volumes mounted into nginx are otherwise populated from the image as
  # root:root. Prepare the shared webroot before SFTP starts so the unprivileged
  # deploy user can create versioned releases on both fresh and existing stacks.
  sftp-volume-init:
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    command:
      - /bin/sh
      - -ec
      - |
        touch /data/.initpad-volume
        chown -R 1000:100 /data
        chmod 0755 /data
    volumes:
      - sftp-www:/data
    restart: 'no'

  fake-sftp:
    image: atmoz/sftp:latest@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475
    # The image ships amd64 only; declare it so arm64 hosts (Apple Silicon)
    # run it via emulation without the platform-mismatch warning.
    platform: linux/amd64
    command: deploy:${INITPAD_SFTP_PASSWORD:-deploy}:::www
    volumes:
      - sftp-www:/home/deploy/www
    depends_on:
      sftp-volume-init: { condition: service_completed_successfully }
    networks: [net-prod]
    restart: unless-stopped

  static-web:
    image: nginx:alpine@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
    depends_on: [fake-sftp]
    ports:
      - '8085:80'
    volumes:
      - sftp-www:/usr/share/nginx/html:ro
      - ../infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [net-prod]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=8m
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 100
    restart: unless-stopped

  fake-vps:
    build: ../infra/fake-vps
    environment:
      PUID: '1000'
      PGID: '1000'
      USER_NAME: deploy
      USER_PASSWORD: ${INITPAD_SSH_PASSWORD:-deploy}
      PASSWORD_ACCESS: 'true'
      SUDO_ACCESS: 'false'
    ports:
      # App ports published 1:1 — must match INITPAD_SSH_APP_PORT_* config.
      - '8090-8189:8090-8189'
    networks: [net-prod]
    restart: unless-stopped

  # --- reverse proxy with automatic HTTPS (server installs only) -----------

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    profiles: ['server']
    ports:
      - '80:80'
      - '443:443'
    environment:
      INITPAD_DOMAIN: ${INITPAD_DOMAIN:-}
      INITPAD_GIT_DOMAIN: ${INITPAD_GIT_DOMAIN:-}
      # Empty = public automatic HTTPS (Let's Encrypt). "tls internal" = Caddy's
      # local CA for LAN/school networks without public reachability (ADR-062).
      INITPAD_TLS_DIRECTIVE: ${INITPAD_TLS_DIRECTIVE:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web, gitea]
    networks: [platform]
    restart: unless-stopped

volumes:
  pgdata: {}
  minio-data: {}
  gitea-data: {}
  runner-data: {}
  runner-docker-data: {}
  sftp-www: {}
  api-data: {}
  supervisor-data: {}
  caddy-data: {}

networks:
  platform: {}
  # API-to-Supervisor management plane. The Supervisor gets outbound release
  # verification access through its separate release-egress network.
  update-control:
    internal: true
  release-egress: {}
  ci-control:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          gateway: 172.31.250.1
  net-dev: {}
  net-test: {}
  net-prod: {}
