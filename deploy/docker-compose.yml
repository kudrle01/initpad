# InitPad — full containerized stack (one-command install, see install.sh).
#
# Local install:   ./install.sh              → http://localhost:8080
# Server install:  set INITPAD_DOMAIN + INITPAD_GIT_DOMAIN in .env, then
#                  ./install.sh              → https://<domain> via Caddy
#
# The infra/ development stack is a separate Compose project (initpad-dev)
# with its own volumes and ports, so both can run at the same time.

name: initpad

services:
  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_USER: initpad
      POSTGRES_PASSWORD: ${INITPAD_DB_PASSWORD:-initpad}
      POSTGRES_DB: initpad
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U initpad']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [platform]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200
    restart: unless-stopped

  # Durable object storage for verified build artifacts (ADR-059). The local
  # demo runs a pinned SeaweedFS S3 gateway (ADR-163, replaces the withdrawn
  # MinIO images); production should point the API's INITPAD_ARTIFACT_S3_*
  # variables at real S3 and can drop this service. The `minio` alias keeps
  # older .env files with INITPAD_ARTIFACT_S3_ENDPOINT=http://minio:9000 working.
  s3:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    command: server -dir=/data -s3 -s3.port=9000 -ip.bind=0.0.0.0 -volume.max=20
    environment:
      # The S3 gateway creates one admin identity from these two variables.
      # Anonymous requests are refused as soon as an identity exists.
      AWS_ACCESS_KEY_ID: ${INITPAD_ARTIFACT_S3_ACCESS_KEY_ID:-initpad}
      AWS_SECRET_ACCESS_KEY: ${INITPAD_ARTIFACT_S3_SECRET_ACCESS_KEY:-initpad-artifacts}
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9333/cluster/status >/dev/null && curl -fsS http://localhost:9000/status >/dev/null']
      interval: 3s
      timeout: 3s
      retries: 40
    networks:
      platform:
        aliases: [minio]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 400
    restart: unless-stopped

  # One-shot: wait for the S3 gateway, create the PRIVATE artifact bucket, then exit.
  # It reuses the SeaweedFS image (`weed shell`), so no separate client image.
  s3-init:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    depends_on:
      s3: { condition: service_healthy }
    environment:
      ARTIFACT_BUCKET: ${INITPAD_ARTIFACT_S3_BUCKET:-initpad-artifacts}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        # Buckets are private: only the configured identity can read or write.
        # Creating an existing bucket is a no-op.
        until echo "s3.bucket.create -name $$ARTIFACT_BUCKET" | weed shell -master=s3:9333 2>&1 | grep -Eq "created bucket|already exists"; do
          echo "waiting for the object store..."; sleep 2;
        done
        echo "artifact bucket ready: $$ARTIFACT_BUCKET"
    networks: [platform]
    restart: 'no'

  gitea:
    image: gitea/gitea:1.22@sha256:538658de667c5d098a274f2f63aa6ec891d88f670cdd5282cf27221ba747dda4
    environment:
      # INSTALL_LOCK skips the web install wizard — the instance is configured
      # entirely from here and from install.sh (no manual clicking).
      GITEA__security__INSTALL_LOCK: 'true'
      GITEA__server__ROOT_URL: ${INITPAD_GITEA_PUBLIC_URL:-http://gitea.localhost:3001/}
      GITEA__actions__ENABLED: 'true'
      # SSO: sign-in through the platform (OIDC) auto-links to an existing
      # account by e-mail; unknown e-mails get a new account.
      GITEA__oauth2_client__ACCOUNT_LINKING: auto
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: 'true'
      GITEA__oauth2_client__USERNAME: nickname
      GITEA__service__DISABLE_REGISTRATION: 'true'
      GITEA__webhook__ALLOWED_HOST_LIST: 'api'
    ports:
      # Must stay published on the host: the host Docker daemon pushes/pulls
      # registry images through this port (build once, deploy many).
      - '${INITPAD_GITEA_HTTP_PORT:-3001}:3000'
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/api/healthz']
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [platform]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 300
    restart: unless-stopped

  api:
    image: ${INITPAD_API_IMAGE:-initpad-api:source}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://initpad:${INITPAD_DB_PASSWORD:-initpad}@postgres:5432/initpad
      # Browser-facing vs server-to-server addresses (split horizon).
      INITPAD_GITEA_URL: ${INITPAD_GITEA_PUBLIC_URL:-http://gitea.localhost:3001}
      INITPAD_GITEA_INTERNAL_URL: http://gitea:3000
      INITPAD_GITEA_USER: ${INITPAD_BOT_USER:-initpad-bot}
      INITPAD_GITEA_TOKEN: ${INITPAD_GITEA_TOKEN:-}
      INITPAD_FRONTEND_URL: ${INITPAD_PUBLIC_URL:-http://localhost:8080}
      INITPAD_PLATFORM_PUBLIC_URL: ${INITPAD_PUBLIC_URL:-http://localhost:8080}
      INITPAD_TRUST_PROXY_HOPS: ${INITPAD_TRUST_PROXY_HOPS:-1}
      # School or office networks behind one public address (ADR-149).
      INITPAD_RATE_LIMIT_SHARED_NETWORKS: ${INITPAD_RATE_LIMIT_SHARED_NETWORKS:-}
      INITPAD_RATE_LIMIT_SHARED_NETWORK_FACTOR: ${INITPAD_RATE_LIMIT_SHARED_NETWORK_FACTOR:-20}
      # Audit events older than this are deleted; 0 keeps them (ADR-150).
      INITPAD_AUDIT_RETENTION_DAYS: ${INITPAD_AUDIT_RETENTION_DAYS:-400}
      # Team workspaces one account may own; 0 is unlimited (ADR-154).
      INITPAD_MAX_OWNED_TEAM_WORKSPACES: ${INITPAD_MAX_OWNED_TEAM_WORKSPACES:-0}
      # User guide linked from the web app (ADR-156); it has self-hosted chapters.
      INITPAD_DOCS_URL: ${INITPAD_DOCS_URL:-https://docs.initpad.me}
      INITPAD_JWT_SECRET: ${INITPAD_JWT_SECRET:?run install.sh to generate secrets}
      INITPAD_ENCRYPTION_KEY: ${INITPAD_ENCRYPTION_KEY:?run install.sh to generate secrets}
      # Set only while rotating INITPAD_ENCRYPTION_KEY (ADR-141, OPERATIONS.md).
      INITPAD_ENCRYPTION_KEY_PREVIOUS: ${INITPAD_ENCRYPTION_KEY_PREVIOUS:-}
      # Optional SMTP delivery. When unset, self-hosted verification and
      # activation links remain available as one-time manual links in the UI.
      INITPAD_SMTP_HOST: ${INITPAD_SMTP_HOST:-}
      INITPAD_SMTP_PORT: ${INITPAD_SMTP_PORT:-587}
      INITPAD_SMTP_SECURE: ${INITPAD_SMTP_SECURE:-false}
      INITPAD_SMTP_REQUIRE_TLS: ${INITPAD_SMTP_REQUIRE_TLS:-true}
      INITPAD_SMTP_USERNAME: ${INITPAD_SMTP_USERNAME:-}
      INITPAD_SMTP_PASSWORD: ${INITPAD_SMTP_PASSWORD:-}
      INITPAD_SMTP_FROM: ${INITPAD_SMTP_FROM:-}
      INITPAD_SCM_WEBHOOK_TOKEN: ${INITPAD_SCM_WEBHOOK_TOKEN:?run install.sh to generate secrets}
      INITPAD_SCM_WEBHOOK_URL: http://api:3000
      INITPAD_REGISTRATION_MODE: ${INITPAD_REGISTRATION_MODE:-admin-provisioned}
      # Needed only while no account exists: the API refuses to create a first
      # production administrator without this installer-generated token.
      INITPAD_BOOTSTRAP_TOKEN: ${INITPAD_BOOTSTRAP_TOKEN:-}
      INITPAD_EDITION: ${INITPAD_EDITION:-self-hosted}
      INITPAD_PLATFORM_VERSION: ${INITPAD_PLATFORM_VERSION:-0.2.36}
      INITPAD_UPDATE_REPOSITORY: ${INITPAD_UPDATE_REPOSITORY:-kudrle01/initpad}
      INITPAD_AGENT_UPDATE_CHANNEL: ${INITPAD_AGENT_UPDATE_CHANNEL:-stable}
      INITPAD_PLATFORM_UPDATE_CHANNEL: ${INITPAD_PLATFORM_UPDATE_CHANNEL:-stable}
      INITPAD_SIGSTORE_CACHE_DIR: /data/sigstore-js
      # Optional OTLP/HTTP export. It is disabled by default so self-hosted
      # installations never depend on an undeclared collector.
      INITPAD_OTEL_ENABLED: ${INITPAD_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-initpad-api}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-60000}
      INITPAD_SUPERVISOR_URL: http://supervisor:7070
      INITPAD_SUPERVISOR_SHARED_SECRET: ${INITPAD_SUPERVISOR_SHARED_SECRET:?run install.sh to generate secrets}
      # Enables the public, checksum-bound Agent installer UX only when it is
      # an immutable digest reference. The enrollment token is never embedded.
      INITPAD_AGENT_IMAGE: ${INITPAD_AGENT_IMAGE:-}
      INITPAD_AGENT_RELEASE_VERSION: ${INITPAD_AGENT_RELEASE_VERSION:-}
      # GitHub App (hosted edition, optional; inert when unset).
      INITPAD_GITHUB_APP_ID: ${INITPAD_GITHUB_APP_ID:-}
      INITPAD_GITHUB_CLIENT_ID: ${INITPAD_GITHUB_CLIENT_ID:-}
      INITPAD_GITHUB_CLIENT_SECRET: ${INITPAD_GITHUB_CLIENT_SECRET:-}
      INITPAD_GITHUB_PRIVATE_KEY: ${INITPAD_GITHUB_PRIVATE_KEY:-}
      INITPAD_GITHUB_WEBHOOK_SECRET: ${INITPAD_GITHUB_WEBHOOK_SECRET:-}
      INITPAD_GITHUB_APP_SLUG: ${INITPAD_GITHUB_APP_SLUG:-}
      INITPAD_GITHUB_CALLBACK_URL: ${INITPAD_GITHUB_CALLBACK_URL:-}
      # Addresses of deployed apps (browser) and health checks (from inside
      # this container → host-published ports via host.docker.internal).
      # Built-in app links normally derive their host from INITPAD_PUBLIC_URL.
      # Only set the override when apps intentionally use a different hostname.
      INITPAD_DEPLOY_PUBLIC_HOST: ${INITPAD_DEPLOY_PUBLIC_HOST:-}
      # Backward-compatible fallback for development environments without a
      # configured public URL; ignored by this Compose profile in normal use.
      INITPAD_PUBLIC_HOST: ${INITPAD_PUBLIC_HOST:-}
      INITPAD_DEPLOY_HEALTH_HOST: host.docker.internal
      INITPAD_DEPLOY_BIND_ADDRESS: ${INITPAD_DEPLOY_BIND_ADDRESS:-127.0.0.1}
      # A loopback-bound app port is also published on the Docker host gateway,
      # where the probe above reaches it; the LAN does not (ADR-174).
      INITPAD_DEPLOY_PROBE_BIND_ADDRESS: ${INITPAD_DEPLOY_PROBE_BIND_ADDRESS:-host.docker.internal}
      INITPAD_DEPLOY_MEMORY_MB: ${INITPAD_DEPLOY_MEMORY_MB:-512}
      INITPAD_DEPLOY_CPU: ${INITPAD_DEPLOY_CPU:-1}
      INITPAD_DEPLOY_PIDS_LIMIT: ${INITPAD_DEPLOY_PIDS_LIMIT:-256}
      # Registry as seen by the host deployment daemon. CI builds inside an
      # isolated daemon and pushes the resulting image to this registry.
      INITPAD_REGISTRY_HOST: ${INITPAD_REGISTRY_HOST:-127.0.0.1:3001}
      INITPAD_CI_REGISTRY_HOST: ${INITPAD_CI_REGISTRY_HOST:-host.docker.internal:3001}
      INITPAD_PLATFORM_INTERNAL_URL: http://host.docker.internal:${INITPAD_WEB_PORT:-8080}
      # Simulated deployment targets (service names inside the compose net).
      # The credentials MUST match how fake-sftp was created below,
      # otherwise the API authenticates with the wrong password.
      INITPAD_SFTP_HOST: fake-sftp
      INITPAD_SFTP_PORT: '22'
      INITPAD_SFTP_USER: deploy
      INITPAD_SFTP_PASSWORD: ${INITPAD_SFTP_PASSWORD:-deploy}
      INITPAD_SFTP_INTERNAL_URL: http://static-web
      INITPAD_STATIC_WEB_PORT: ${INITPAD_STATIC_WEB_PORT:-8085}
      # SSO: Gitea (server) calls the API by service name; the browser goes
      # through the web origin (nginx proxies /api → api:3000).
      INITPAD_OIDC_ISSUER: http://api:3000/api
      INITPAD_OIDC_PUBLIC_URL: ${INITPAD_PUBLIC_URL:-http://localhost:8080}/api
      INITPAD_OIDC_CLIENT_SECRET: ${INITPAD_OIDC_CLIENT_SECRET:?run install.sh to generate secrets}
      INITPAD_OIDC_KEY_FILE: /data/oidc-key.pem
      INITPAD_PRIVATE_CA_FILE: /run/initpad-tls/initpad-root-ca.crt
      INITPAD_TEMPLATES_DIR: /templates
      INITPAD_WORKSPACE_DIR: /data/workspace
      # Durable object storage for verified build artifacts (ADR-059). Local demo
      # points at the bundled SeaweedFS; a cloud install sets these to a real S3
      # endpoint/bucket/credentials. The SaaS edition refuses to start unset.
      INITPAD_ARTIFACT_S3_ENDPOINT: ${INITPAD_ARTIFACT_S3_ENDPOINT:-http://s3:9000}
      INITPAD_ARTIFACT_S3_REGION: ${INITPAD_ARTIFACT_S3_REGION:-us-east-1}
      INITPAD_ARTIFACT_S3_BUCKET: ${INITPAD_ARTIFACT_S3_BUCKET:-initpad-artifacts}
      INITPAD_ARTIFACT_S3_ACCESS_KEY_ID: ${INITPAD_ARTIFACT_S3_ACCESS_KEY_ID:-initpad}
      INITPAD_ARTIFACT_S3_SECRET_ACCESS_KEY: ${INITPAD_ARTIFACT_S3_SECRET_ACCESS_KEY:-initpad-artifacts}
      INITPAD_ARTIFACT_S3_FORCE_PATH_STYLE: 'true'
      # Upper bounds for calls that could otherwise hang a deploy (ADR-176).
      INITPAD_ARTIFACT_S3_CONNECTION_TIMEOUT_MS: ${INITPAD_ARTIFACT_S3_CONNECTION_TIMEOUT_MS:-10000}
      INITPAD_ARTIFACT_S3_REQUEST_TIMEOUT_MS: ${INITPAD_ARTIFACT_S3_REQUEST_TIMEOUT_MS:-120000}
      INITPAD_GIT_TIMEOUT_MS: ${INITPAD_GIT_TIMEOUT_MS:-120000}
      INITPAD_SSH_KEEPALIVE_INTERVAL_MS: ${INITPAD_SSH_KEEPALIVE_INTERVAL_MS:-15000}
      INITPAD_SFTP_DEPLOY_TIMEOUT_MS: ${INITPAD_SFTP_DEPLOY_TIMEOUT_MS:-900000}
      TMPDIR: /var/lib/initpad-work
    volumes:
      # The API drives deployments through the host Docker daemon. The :ro
      # suffix protects only the socket inode; Docker API access is inherently
      # host-privileged and is intentionally confined to the control plane.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Templates come from the image (/templates), so they always match the
      # running API version, also after Install update.
      - api-data:/data
      # Deployment working files (ADR-172): an exported image archive is as
      # large as the image, often well over the /tmp tmpfs, and tmpfs pages
      # count against mem_limit. TMPDIR points Node's os.tmpdir() here; the API
      # clears stale initpad-* entries at startup. Not part of backups.
      - api-work:/var/lib/initpad-work
      # Public root of the internal CA only (ADR-161): Manage Agent pins its
      # checksum in the generated installation command.
      - ./.runtime/tls:/run/initpad-tls:ro
    extra_hosts:
      # Works on Docker Desktop out of the box; this line makes it work on
      # plain Linux too (health checks of host-published app ports).
      - 'host.docker.internal:host-gateway'
    healthcheck:
      # busybox wget is available in node:alpine.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health/ready']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      gitea: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    networks: [platform, update-control, net-prod]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 300
    restart: unless-stopped

  web:
    image: ${INITPAD_WEB_IMAGE:-initpad-web:source}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - '${INITPAD_WEB_PORT:-8080}:80'
    depends_on: [api]
    networks: [platform]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    # nginx runs as the nginx user and writes only /tmp (ADR-144).
    read_only: true
    tmpfs:
      - /tmp:size=40m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    restart: unless-stopped

  # Minimal privileged updater (ADR-111). It has no published port and accepts
  # only short-lived HMAC-authenticated requests from the API. The Docker
  # socket is intentionally isolated here; browser input never becomes a
  # command, image reference or Compose fragment.
  supervisor:
    image: ${INITPAD_SUPERVISOR_IMAGE:-initpad-supervisor:source}
    build:
      context: ..
      dockerfile: apps/supervisor/Dockerfile
    container_name: initpad-supervisor
    environment:
      INITPAD_INSTALL_ROOT: ${INITPAD_INSTALL_ROOT:?run install.sh to configure the install root}
      INITPAD_PLATFORM_VERSION: ${INITPAD_PLATFORM_VERSION:-0.2.36}
      INITPAD_SUPERVISOR_CONTAINER_NAME: initpad-supervisor
      INITPAD_SUPERVISOR_SHARED_SECRET: ${INITPAD_SUPERVISOR_SHARED_SECRET:?run install.sh to generate secrets}
      INITPAD_UPDATE_REPOSITORY: ${INITPAD_UPDATE_REPOSITORY:-kudrle01/initpad}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - supervisor-data:/var/lib/initpad-supervisor
      # Host Compose commands read the same signed-release override so the
      # selected release survives maintenance and re-running install.sh.
      - ./.runtime/platform-update:/var/lib/initpad-supervisor/runtime
      - type: bind
        source: ${INITPAD_INSTALL_ROOT:?run install.sh to configure the install root}
        target: ${INITPAD_INSTALL_ROOT:?run install.sh to configure the install root}
        read_only: true
    networks: [update-control, release-egress]
    healthcheck:
      test: ['CMD', 'node', 'dist/cli.js', 'health']
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped

  # Read-only pull-through cache for the Docker Hub images CI jobs pull. Every
  # job starts on an erased daemon (ADR-138), so without it each job would
  # download its job image and Dockerfile base images from Docker Hub again.
  # It rejects pushes and deletes, so a job cannot place content in it.
  runner-image-cache:
    image: registry:3.1.2@sha256:38907510915c3f1604c7e83d6ab602ab3020d092f73bdaed8696773693ff768c
    profiles: ['runner']
    # A directory mount, unlike a file mount, follows a configuration that a
    # platform update replaces.
    command: ['/opt/initpad-runner/image-cache.yml']
    environment:
      # No trace collector exists; otherwise the registry logs a failed export.
      OTEL_TRACES_EXPORTER: none
    volumes:
      - ./runner:/opt/initpad-runner:ro
      - runner-image-cache:/var/lib/registry
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5000/v2/']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      ci-control:
        # The rootless daemon has no access to Docker's embedded DNS, so it
        # reaches the cache by a fixed address, like the host gateway below.
        ipv4_address: 172.31.250.10
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped

  # The seed volume is written by runner-seed as the rootless user (uid 1000).
  runner-seed-init:
    image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    profiles: ['runner']
    command: ['chown', '1000:1000', '/seed']
    volumes:
      - runner-docker-seed:/seed
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    restart: 'no'

  # One-shot image seed for the CI daemons (ADR-170). install.sh runs it on
  # every install and update; it pulls deploy/runner/seed-images by digest on a
  # throw-away daemon and saves them to runner-docker-seed. It runs no job code,
  # and runner-docker mounts the result read-only, so a job cannot change it.
  runner-seed:
    image: docker:27.5.1-dind-rootless@sha256:e2ac8e8f66ae21a060b0a8e3005c70f6ed9441aabf409434463d1f6eecd38026
    profiles: ['runner']
    privileged: true
    init: true
    entrypoint: ['/bin/sh', '/opt/initpad-runner/ci-seed.sh']
    environment:
      DOCKER_TLS_CERTDIR: ''
      DOCKER_HOST: tcp://127.0.0.1:2375
    volumes:
      - ./runner:/opt/initpad-runner:ro
      - runner-docker-seed:/seed
    depends_on:
      runner-seed-init: { condition: service_completed_successfully }
    # Not on ci-control: a running job must not reach this daemon's API, or it
    # could place its own image in the seed before it is saved.
    networks: [runner-seed]
    mem_limit: ${INITPAD_RUNNER_MEMORY_LIMIT:-1536m}
    cpus: ${INITPAD_RUNNER_CPU_LIMIT:-1.0}
    pids_limit: ${INITPAD_RUNNER_PIDS_LIMIT:-512}
    restart: 'no'

  # Dedicated rootless Docker daemon for untrusted CI jobs. It is privileged
  # only inside this container so rootless Docker can create namespaces; the
  # physical host socket and filesystem are never mounted into a workflow.
  # The outer cgroup is also the aggregate resource envelope for every nested
  # build container, so CI cannot starve the platform control plane.
  # Each CI job gets a freshly erased daemon (ADR-138): the entry point erases
  # the daemon state on every start and act_runner restarts this container
  # after each job. The root filesystem is read-only and every other writable
  # path is a tmpfs, so a restart also discards files a job wrote through the
  # Docker API.
  runner-docker:
    image: docker:27.5.1-dind-rootless@sha256:e2ac8e8f66ae21a060b0a8e3005c70f6ed9441aabf409434463d1f6eecd38026
    profiles: ['runner']
    privileged: true
    init: true
    entrypoint: ['/bin/sh', '/opt/initpad-runner/ci-daemon.sh']
    environment:
      DOCKER_TLS_CERTDIR: ''
      DOCKER_HOST: tcp://127.0.0.1:2375
      # With "tls internal" the entry point trusts InitPad's CA for exactly this
      # registry host (ADR-161); .runtime/tls holds only the public root.
      INITPAD_CI_REGISTRY_HOST: ${INITPAD_CI_REGISTRY_HOST:-host.docker.internal:3001}
    command:
      - '--host=tcp://0.0.0.0:2375'
      - '--tls=false'
      # Only the same-host, non-public alias is HTTP. A configured public CI
      # registry still uses verified TLS and is not placed on this allow-list.
      - '--insecure-registry=host.docker.internal:${INITPAD_GITEA_HTTP_PORT:-3001}'
      - '--registry-mirror=http://172.31.250.10:5000'
      # The containerd image store lets an ordinary `docker build` export its
      # layer cache to the project's own registry (ADR-139). It reaches the
      # internal image cache over HTTP only when the host is listed here.
      - '--feature=containerd-snapshotter=true'
      - '--insecure-registry=172.31.250.10:5000'
    volumes:
      - ./runner:/opt/initpad-runner:ro
      - ./.runtime/tls:/opt/initpad-tls:ro
      - runner-docker-data:/home/rootless/.local/share/docker
      - runner-reset:/run/initpad-ci-reset:ro
      # Images every job needs, loaded after each reset (ADR-170). Read-only.
      - runner-docker-seed:/opt/initpad-seed:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/user/1000:size=64m,uid=1000,gid=1000,mode=0700
      - /home/rootless:size=64m,uid=1000,gid=1000,mode=0755
    healthcheck:
      test: ['CMD', 'docker', 'info']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    extra_hosts:
      # Docker's generic host-gateway may resolve to the unrelated default
      # bridge (usually 172.17.0.1). This service only joins ci-control, whose
      # fixed gateway is the reachable outer host address used by CI jobs.
      # Gitea's auth challenge may use its canonical gitea.localhost realm.
      - 'host.docker.internal:172.31.250.1'
      - 'gitea.localhost:172.31.250.1'
    depends_on:
      runner-image-cache: { condition: service_started }
    networks: [ci-control]
    mem_limit: ${INITPAD_RUNNER_MEMORY_LIMIT:-1536m}
    cpus: ${INITPAD_RUNNER_CPU_LIMIT:-1.0}
    pids_limit: ${INITPAD_RUNNER_PIDS_LIMIT:-512}
    restart: unless-stopped

  # Gitea Actions runner — registered automatically by install.sh. It keeps the
  # runner credential outside the daemon container, takes one job at a time
  # and starts it only on a daemon erased since the previous job (ADR-138).
  act_runner:
    image: gitea/act_runner:0.2.13@sha256:8477d5b61b655caad4449888bae39f1f34bebd27db56cb15a62dccb3dcf3a944
    profiles: ['runner']
    entrypoint: ['/sbin/tini', '--', '/bin/bash', '/opt/initpad-runner/ci-runner.sh']
    environment:
      # Persisted by act_runner and passed to checkout jobs. Keep it separate
      # from the browser URL: glibc treats *.localhost as IPv6 loopback.
      GITEA_INSTANCE_URL: ${INITPAD_GITEA_RUNNER_URL:-http://host.docker.internal:3001}
      GITEA_RUNNER_REGISTRATION_TOKEN: ${INITPAD_RUNNER_TOKEN:-}
      GITEA_RUNNER_NAME: initpad-runner
      GITEA_RUNNER_LABELS: 'ubuntu-latest:docker://catthehacker/ubuntu:act-latest@sha256:c58e2b364da03b0c804c7d660f2ecbedf2f221a382b9baa0b344b0144780ff43'
      CONFIG_FILE: /config.yaml
      # Waited for after each daemon reset, while the seed loads (ADR-170).
      INITPAD_CI_SEED_IMAGE: catthehacker/ubuntu:act-latest
    volumes:
      - ./.runtime/act-runner-config.yaml:/config.yaml:ro
      - runner-docker-seed:/opt/initpad-seed:ro
      - ./runner:/opt/initpad-runner:ro
      - runner-data:/data
      - runner-reset:/run/initpad-ci-reset
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      gitea: { condition: service_healthy }
      api: { condition: service_healthy }
      runner-docker: { condition: service_healthy }
    networks: [platform, ci-control]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped

  # --- simulated deployment targets (real protocols, stand-in containers) ---

  # Named volumes mounted into nginx are otherwise populated from the image as
  # root:root. Prepare the shared webroot before SFTP starts so the unprivileged
  # deploy user can create versioned releases on both fresh and existing stacks.
  sftp-volume-init:
    image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    command:
      - /bin/sh
      - -ec
      - |
        touch /data/.initpad-volume
        chown -R 1000:100 /data
        chmod 0755 /data
    volumes:
      - sftp-www:/data
    restart: 'no'

  fake-sftp:
    image: atmoz/sftp:latest@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475
    # The image ships amd64 only; declare it so arm64 hosts (Apple Silicon)
    # run it via emulation without the platform-mismatch warning.
    platform: linux/amd64
    command: deploy:${INITPAD_SFTP_PASSWORD:-deploy}:::www
    volumes:
      - sftp-www:/home/deploy/www
    depends_on:
      sftp-volume-init: { condition: service_completed_successfully }
    networks: [net-prod]
    restart: unless-stopped

  static-web:
    image: nginx:alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    depends_on: [fake-sftp]
    ports:
      - '${INITPAD_STATIC_WEB_PORT:-8085}:80'
    volumes:
      - sftp-www:/usr/share/nginx/html:ro
      - ../infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [net-prod]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=8m
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 100
    restart: unless-stopped

  # --- reverse proxy with automatic HTTPS (server installs only) -----------

  caddy:
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    profiles: ['server']
    ports:
      - '80:80'
      - '443:443'
    environment:
      INITPAD_DOMAIN: ${INITPAD_DOMAIN:-}
      INITPAD_GIT_DOMAIN: ${INITPAD_GIT_DOMAIN:-}
      # Empty = public automatic HTTPS (Let's Encrypt). "tls internal" = Caddy's
      # local CA for LAN/school networks without public reachability (ADR-062).
      INITPAD_TLS_DIRECTIVE: ${INITPAD_TLS_DIRECTIVE:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api, web, gitea]
    networks: [platform]
    restart: unless-stopped

volumes:
  pgdata: {}
  s3-data: {}
  gitea-data: {}
  runner-data: {}
  runner-docker-data: {}
  runner-docker-seed: {}
  runner-image-cache: {}
  runner-reset: {}
  sftp-www: {}
  api-data: {}
  api-work: {}
  supervisor-data: {}
  caddy-data: {}

networks:
  platform: {}
  # API-to-Supervisor management plane. The Supervisor gets outbound release
  # verification access through its separate release-egress network.
  update-control:
    internal: true
  release-egress: {}
  ci-control:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          gateway: 172.31.250.1
  # Only runner-seed: outbound access to the registry, no job in reach.
  runner-seed: {}
  net-dev: {}
  net-test: {}
  net-prod: {}
