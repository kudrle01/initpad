# Isolated local simulation of a customer-owned Docker server. Compose this
# file with docker-compose.yml through ./agent-lab.sh; it is not part of the
# normal self-hosted runtime and publishes no Docker API port to the host.
# A dedicated bridge exposes only the workload test range on host loopback so
# links returned by the Agent can be opened from the local browser.

services:
  agent-lab-docker:
    image: docker:27.5.1-dind
    profiles: ["agent-lab"]
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - "--host=tcp://0.0.0.0:2375"
      - "--tls=false"
    # Keep automatically allocated workload ports inside a small lab-only
    # range. Docker Desktop cannot reliably forward a nested DinD NAT mapping,
    # so agent-lab-ports bridges these ports explicitly on the outer network.
    sysctls:
      net.ipv4.ip_local_port_range: "${INITPAD_AGENT_LAB_PORT_START:-42000} ${INITPAD_AGENT_LAB_PORT_END:-42031}"
    volumes:
      - agent-lab-docker-data:/var/lib/docker
      - agent-lab-gateway-admin:/var/lib/initpad-gateway-admin
    ports:
      # Fixed application-gateway listener only. The nested Docker API and
      # Caddy admin API remain private to the outer agent-lab-target network.
      - "${INITPAD_AGENT_LAB_BIND_ADDRESS:-127.0.0.1}:${INITPAD_AGENT_LAB_GATEWAY_PORT:-4180}:4180"
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    networks: [agent-lab-target]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 384
    restart: unless-stopped

  # One-shot lab provisioning. The actual Caddy gateway runs in the same
  # isolated Docker daemon as project workloads, receives no Docker socket and
  # is connected to a workload network only by the enrolled Agent.
  agent-lab-gateway-bootstrap:
    image: docker:27.5.1-cli
    profiles: ["agent-lab"]
    environment:
      DOCKER_HOST: tcp://agent-lab-docker:2375
      DOCKER_CONFIG: /tmp/docker
      INITPAD_AGENT_GATEWAY_CONTAINER: initpad-agent-lab-gateway
    command: ["sh", "/bootstrap/agent-lab-gateway-bootstrap.sh"]
    volumes:
      - ./agent-lab-gateway-bootstrap.sh:/bootstrap/agent-lab-gateway-bootstrap.sh:ro
      - ./agent-lab-caddy.json:/bootstrap/agent-lab-caddy.json:ro
    depends_on:
      agent-lab-docker: { condition: service_healthy }
    networks: [agent-lab-target]
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 48m
    cpus: 0.1
    pids_limit: 32
    restart: "no"

  # Target-side wildcard DNS. Agent containers receive the edge's private
  # address; this resolver is deliberately not published to the host.
  agent-lab-dns:
    image: coredns/coredns:1.14.6
    profiles: ["agent-lab"]
    command: ["-conf", "/etc/coredns/Corefile"]
    environment:
      INITPAD_AGENT_LAB_GATEWAY_DOMAIN: ${INITPAD_AGENT_LAB_GATEWAY_DOMAIN:-apps.initpad.test}
      INITPAD_AGENT_LAB_EDGE_IP: ${INITPAD_AGENT_LAB_EDGE_IP:-172.31.251.10}
    volumes:
      - ./agent-lab.Corefile:/etc/coredns/Corefile:ro
    networks:
      agent-lab-edge:
        ipv4_address: ${INITPAD_AGENT_LAB_DNS_IP:-172.31.251.53}
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m
    cpus: 0.1
    pids_limit: 32
    restart: unless-stopped

  # Host-side view of the same wildcard zone. macOS receives loopback because
  # Docker publishes the TLS edge on 127.0.0.1; returning the private bridge
  # address here would make browser behavior runtime-dependent.
  agent-lab-host-dns:
    image: coredns/coredns:1.14.6
    profiles: ["agent-lab"]
    command: ["-conf", "/etc/coredns/Corefile"]
    environment:
      INITPAD_AGENT_LAB_GATEWAY_DOMAIN: ${INITPAD_AGENT_LAB_GATEWAY_DOMAIN:-apps.initpad.test}
      INITPAD_AGENT_LAB_EDGE_IP: 127.0.0.1
    volumes:
      - ./agent-lab.Corefile:/etc/coredns/Corefile:ro
    ports:
      - "127.0.0.1:${INITPAD_AGENT_LAB_DNS_PORT:-5533}:53/tcp"
      - "127.0.0.1:${INITPAD_AGENT_LAB_DNS_PORT:-5533}:53/udp"
    networks: [agent-lab-edge]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m
    cpus: 0.1
    pids_limit: 32
    restart: unless-stopped

  # Browser-facing local TLS edge. Caddy's internal CA is mounted read-only
  # into the Agent, while the edge itself never receives the Docker socket or
  # the private Caddy admin socket.
  agent-lab-edge:
    image: caddy:2.10-alpine
    profiles: ["agent-lab"]
    environment:
      INITPAD_AGENT_LAB_GATEWAY_DOMAIN: ${INITPAD_AGENT_LAB_GATEWAY_DOMAIN:-apps.initpad.test}
    volumes:
      - ./agent-lab-edge.Caddyfile:/etc/caddy/Caddyfile:ro
      - agent-lab-edge-data:/data
    ports:
      - "127.0.0.1:${INITPAD_AGENT_LAB_TLS_PORT:-443}:443"
    depends_on:
      agent-lab-docker: { condition: service_healthy }
      agent-lab-dns: { condition: service_started }
      agent-lab-host-dns: { condition: service_started }
    networks:
      agent-lab-target: {}
      agent-lab-edge:
        ipv4_address: ${INITPAD_AGENT_LAB_EDGE_IP:-172.31.251.10}
    healthcheck:
      test: ["CMD", "test", "-s", "/data/caddy/pki/authorities/local/root.crt"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
    read_only: true
    tmpfs:
      - /config:size=8m,mode=0700
      - /tmp:size=4m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    cpus: 0.15
    pids_limit: 64
    restart: unless-stopped

  agent-lab-ports:
    image: node:22-alpine
    profiles: ["agent-lab"]
    command: ["node", "/bridge/agent-lab-port-bridge.mjs"]
    environment:
      INITPAD_AGENT_LAB_TARGET_HOST: agent-lab-docker
      INITPAD_AGENT_LAB_PORT_START: ${INITPAD_AGENT_LAB_PORT_START:-42000}
      INITPAD_AGENT_LAB_PORT_END: ${INITPAD_AGENT_LAB_PORT_END:-42031}
    volumes:
      - ./agent-lab-port-bridge.mjs:/bridge/agent-lab-port-bridge.mjs:ro
    ports:
      - "${INITPAD_AGENT_LAB_BIND_ADDRESS:-127.0.0.1}:${INITPAD_AGENT_LAB_PORT_START:-42000}-${INITPAD_AGENT_LAB_PORT_END:-42031}:${INITPAD_AGENT_LAB_PORT_START:-42000}-${INITPAD_AGENT_LAB_PORT_END:-42031}"
    depends_on:
      agent-lab-docker: { condition: service_healthy }
    networks: [agent-lab-target]
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 48m
    cpus: 0.1
    pids_limit: 32
    restart: unless-stopped

  agent-lab:
    # Both lab identities deliberately use the same versioned development
    # image. Without an explicit tag Compose builds the extended secondary
    # service under a separate name, which can silently remain outdated.
    image: initpad-agent-lab:dev
    build:
      context: ..
      dockerfile: apps/agent/Dockerfile
    profiles: ["agent-lab"]
    environment:
      DOCKER_HOST: tcp://agent-lab-docker:2375
      INITPAD_AGENT_CONFIG: /var/lib/initpad-agent/agent.json
      INITPAD_AGENT_GATEWAY_ADMIN_SOCKET: /run/initpad-gateway/admin.sock
      INITPAD_AGENT_GATEWAY_CONTAINER: initpad-agent-lab-gateway
      # The diagnostic port exists only inside the private outer lab network;
      # the browser-facing endpoint is the fixed gateway listener above.
      INITPAD_AGENT_MANAGED_HEALTH_BIND: 0.0.0.0
      # Node reads this CA at process start. The dependency below guarantees
      # Caddy has generated it before either Agent identity starts.
      NODE_EXTRA_CA_CERTS: /var/lib/initpad-edge/caddy/pki/authorities/local/root.crt
    volumes:
      - agent-lab-config:/var/lib/initpad-agent
      - agent-lab-gateway-admin:/run/initpad-gateway:ro
      - agent-lab-edge-data:/var/lib/initpad-edge:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      agent-lab-docker: { condition: service_healthy }
      agent-lab-gateway-bootstrap: { condition: service_completed_successfully }
      agent-lab-edge: { condition: service_healthy }
    dns:
      - ${INITPAD_AGENT_LAB_DNS_IP:-172.31.251.53}
    healthcheck:
      test: ["CMD", "node", "/app/dist/cli.js", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [agent-lab-target, agent-lab-edge]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 96
    restart: unless-stopped

  # A second target identity backed by the same physical DinD daemon. It is
  # started only through the explicit secondary helper commands and keeps a
  # separate root-only credential volume. This models two customer-owned
  # targets on one server without weakening either target identity.
  agent-lab-secondary:
    extends:
      service: agent-lab
    volumes:
      - agent-lab-secondary-config:/var/lib/initpad-agent

networks:
  agent-lab-target:
    name: initpad-agent-lab-target
  agent-lab-edge:
    name: initpad-agent-lab-edge
    ipam:
      config:
        - subnet: ${INITPAD_AGENT_LAB_EDGE_SUBNET:-172.31.251.0/24}
          gateway: ${INITPAD_AGENT_LAB_EDGE_GATEWAY:-172.31.251.1}
volumes:
  agent-lab-config:
  agent-lab-secondary-config:
  agent-lab-docker-data:
  agent-lab-gateway-admin:
  agent-lab-edge-data:
