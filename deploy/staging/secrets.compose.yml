# Secret projection of the ADR-132 staging. The Infisical Agent renders one
# root-only file per secret into /secure/runtime/secrets, where the SaaS profile
# and the edge services mount them read-only. Start this project first: every
# other Compose model on the host refers to the files it creates.

name: initpad-staging-secrets

services:
  secrets-agent:
    # Infisical CLI 0.43.139
    image: infisical/cli@sha256:2d36210eb14237f1d193fdd0686e252e5c3205f26df77589b0f79f42c119fdc1
    command: ['agent', '--config', '/etc/infisical/agent.yaml']
    environment:
      INFISICAL_DISABLE_UPDATE_CHECK: 'true'
    volumes:
      - /secure/runtime/infisical-agent.yaml:/etc/infisical/agent.yaml:ro
      # Machine identity (read) and the renewed access token (write).
      - /secure/runtime/infisical:/secure/runtime/infisical
      - /secure/runtime/secrets:/secure/runtime/secrets
    read_only: true
    tmpfs:
      - /tmp:size=8m
      - /root:size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    restart: unless-stopped
