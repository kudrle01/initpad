# Unit tests of alert-rules.yaml, run from this directory:
#   docker run --rm --entrypoint promtool -v "$PWD:/w" -w /w prom/prometheus:v3.5.0 test rules alert-rules.test.yaml
rule_files: [alert-rules.yaml]
evaluation_interval: 1m
tests:
  - name: readiness failing for 3 minutes fires, healthy does not
    interval: 1m
    input_series:
      - series: 'httpcheck_status{http_status_class="2xx"}'
        values: '1 1 0 0 0 0'
      - series: 'initpad_http_requests_total{instance="a"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 3m
        alertname: InitPadApiUnavailable
        exp_alerts: []
      - eval_time: 5m
        alertname: InitPadApiUnavailable
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: Readiness of the public origin fails., runbook: deploy/SAAS_STAGING.md#incident-runbook}
  - name: error rate
    interval: 1m
    input_series:
      - series: 'initpad_http_requests_total{instance="a",initpad_http_status_class="2xx"}'
        values: '0+20x30'
      - series: 'initpad_http_requests_total{instance="a",initpad_http_status_class="5xx"}'
        values: '0+0x10 0+2x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: InitPadHighErrorRate
        exp_alerts: []
      - eval_time: 25m
        alertname: InitPadHighErrorRate
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: More than 2 % of API responses are 5xx., runbook: deploy/SAAS_STAGING.md#incident-runbook}
  - name: error rate below 20 requests stays quiet
    interval: 1m
    input_series:
      - series: 'initpad_http_requests_total{instance="a",initpad_http_status_class="5xx"}'
        values: '0+1x30'
      - series: 'initpad_http_requests_total{instance="a",initpad_http_status_class="2xx"}'
        values: '0+2x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: InitPadHighErrorRate
        exp_alerts: []
  - name: latency p95 above 2 s
    interval: 1m
    input_series:
      - series: 'initpad_http_request_duration_milliseconds_bucket{le="500"}'
        values: '0+10x10 0+0x30'
      - series: 'initpad_http_request_duration_milliseconds_bucket{le="5000"}'
        values: '0+10x40'
      - series: 'initpad_http_request_duration_milliseconds_bucket{le="+Inf"}'
        values: '0+10x40'
      - series: 'initpad_http_requests_total{instance="a"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: InitPadHighLatency
        exp_alerts: []
      - eval_time: 30m
        alertname: InitPadHighLatency
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: The API p95 latency is above 2 seconds., runbook: deploy/SAAS_STAGING.md#incident-runbook}
  - name: telemetry gap of all and of one instance
    interval: 1m
    input_series:
      - series: 'initpad_http_requests_total{instance="a"}'
        values: '0+1x10 _x30'
      - series: 'initpad_http_requests_total{instance="b"}'
        values: '0+1x20 _x20'
    alert_rule_test:
      - eval_time: 8m
        alertname: InitPadTelemetryGap
        exp_alerts: []
      - eval_time: 18m
        alertname: InitPadTelemetryGap
        exp_alerts:
          - exp_labels: {severity: warning, scope: instance, instance: a}
            exp_annotations: {summary: API instance a stopped exporting telemetry., runbook: deploy/SAAS_STAGING.md#incident-runbook}
      - eval_time: 27m
        alertname: InitPadTelemetryGap
        exp_alerts:
          - exp_labels: {severity: warning, scope: all}
            exp_annotations: {summary: No API telemetry arrived for 5 minutes., runbook: deploy/SAAS_STAGING.md#incident-runbook}
          - exp_labels: {severity: warning, scope: instance, instance: a}
            exp_annotations: {summary: API instance a stopped exporting telemetry., runbook: deploy/SAAS_STAGING.md#incident-runbook}
          - exp_labels: {severity: warning, scope: instance, instance: b}
            exp_annotations: {summary: API instance b stopped exporting telemetry., runbook: deploy/SAAS_STAGING.md#incident-runbook}
  - name: one failed mail fires, sent mail does not
    interval: 1m
    input_series:
      - series: 'initpad_log_events_total{event="mail.outbox.failed"}'
        values: '_x5 1 _x20'
      - series: 'initpad_http_requests_total{instance="a"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 4m
        alertname: InitPadMailOutboxFailed
        exp_alerts: []
      - eval_time: 6m
        alertname: InitPadMailOutboxFailed
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: An e-mail exhausted its delivery attempts., runbook: deploy/SAAS_STAGING.md#incident-runbook}
      - eval_time: 20m
        alertname: InitPadMailOutboxFailed
        exp_alerts: []
  - name: three takeovers stay quiet, four fire
    interval: 1m
    input_series:
      - series: 'initpad_log_events_total{event="control_plane.leader.acquired"}'
        values: '1 _x2 2 _x2 3 _x30 4 _x2 5 _x2 6 _x2 7'
      - series: 'initpad_http_requests_total{instance="a"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 8m
        alertname: InitPadLeaderChurn
        exp_alerts: []
      - eval_time: 48m
        alertname: InitPadLeaderChurn
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: The control-plane leader changed more than 3 times in 15 minutes., runbook: deploy/SAAS_STAGING.md#incident-runbook}
