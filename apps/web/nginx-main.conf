# Main configuration of the platform web image (ADR-144). nginx runs as the
# unprivileged nginx user, so the pid file and every temporary path live in
# /tmp, the only writable path of the read-only container. The server block is
# in nginx.conf.
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # The access log keeps the requested path without its query string and
    # without the Referer: either can carry a one-time code, such as an OAuth
    # authorization code or a link token in an older path-style link.
    map $request_uri $request_path {
        ~^(?<path>[^?]*) $path;
    }
    log_format main '$remote_addr [$time_local] "$request_method $request_path $server_protocol" '
                    '$status $body_bytes_sent $request_time "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
