# Serves the built SPA and proxies /api to the platform API container.
# Same-origin API keeps the session cookie handling trivial.
server {
    listen 80;
    server_name _;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    # Agent image archives can be hundreds of megabytes. Stream this single,
    # authenticated endpoint directly instead of filling nginx's deliberately
    # small read-only-container tmpfs proxy cache.
    location ~ ^/api/agent/jobs/[A-Za-z0-9_-]+/artifact$ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 10m;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA fallback for client-side routing.
        try_files $uri /index.html;
    }

    location ~* ^/assets/.+\.(?:css|js|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
    }
}
