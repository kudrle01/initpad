name: ci
on: [push]

# The pipeline is split into jobs so that each maps to one stage in the
# platform (build → test → docker build → deploy). Gitea creates a commit
# status per job; the platform reads these to render the pipeline view.
#
# Note: Node and npm ship inside the runner image
# (catthehacker/ubuntu:act-latest), so actions/setup-node is intentionally
# not used — it downloads from github.com and is the most common source of
# failures on an unstable network.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --version && npm --version
      - run: npm install

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm test

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # Build once, deploy many: the image is built ONCE and pushed to the
      # Gitea registry tagged with the commit hash. The platform then only
      # pulls and runs it (dev/test/prod = the same image). Registry =
      # localhost:3001 (reachable from the host's Docker daemon); credentials
      # come from the bot's Actions secrets.
      - name: build & push image
        run: |
          IMAGE=$(echo "localhost:3001/${{ github.repository }}:${{ github.sha }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.INITPAD_REGISTRY_PASSWORD }}" | \
            docker login localhost:3001 -u "${{ secrets.INITPAD_REGISTRY_USER }}" --password-stdin
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      # After a successful build, tell the platform to sync this commit and
      # deploy dev. host.docker.internal = the platform API on the host;
      # token = the Actions secret set by the platform at repo creation.
      - name: notify platform
        run: |
          curl -fsS -X POST http://host.docker.internal:3000/api/ci/deploy \
            -H "Authorization: Bearer ${{ secrets.INITPAD_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"repo":"${{ github.repository }}","sha":"${{ github.sha }}","ref":"${{ github.ref_name }}"}'
