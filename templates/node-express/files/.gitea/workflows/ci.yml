name: ci
on: [push]

# One job tests, builds and publishes the image (ADR-139). Each CI job starts on
# a fresh Docker daemon, so separate jobs would each rebuild from scratch.
# The tests run in the image's build stage, so the image cannot exist without
# them passing.
jobs:
  build:
    runs-on: ubuntu-latest
    # Context values reach the scripts as data, never as shell code: a branch
    # name may contain quotes or $(...).
    env:
      CI_REPOSITORY: ${{ github.repository }}
      CI_SHA: ${{ github.sha }}
      CI_REF: ${{ github.ref_name }}
    steps:
      - name: mark CI as started
        env:
          INITPAD_PLATFORM_URL: ${{ secrets.INITPAD_PLATFORM_URL }}
          INITPAD_DEPLOY_TOKEN: ${{ secrets.INITPAD_DEPLOY_TOKEN }}
        run: |
          body=$(jq -n --arg repo "$CI_REPOSITORY" --arg sha "$CI_SHA" --arg ref "$CI_REF" '$ARGS.named')
          # The push may win a short race with InitPad's project transaction.
          # Retry only this progress signal; a failure must not block the build.
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 3 -X POST "$INITPAD_PLATFORM_URL/api/ci/start" \
              -H "Authorization: Bearer $INITPAD_DEPLOY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$body"; then
              exit 0
            fi
            [ "$attempt" -eq 6 ] || sleep 2
          done
          echo "::warning::InitPad progress callback failed"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: prepare image
        env:
          INITPAD_REGISTRY: ${{ secrets.INITPAD_REGISTRY }}
          INITPAD_REGISTRY_USER: ${{ secrets.INITPAD_REGISTRY_USER }}
          INITPAD_REGISTRY_PASSWORD: ${{ secrets.INITPAD_REGISTRY_PASSWORD }}
        run: |
          IMAGE=$(echo "$INITPAD_REGISTRY/$CI_REPOSITORY:$CI_SHA" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          # Build layers are cached next to the image, in this repository's registry.
          echo "CACHE=${IMAGE%:*}:buildcache" >> "$GITHUB_ENV"
          echo "$INITPAD_REGISTRY_PASSWORD" | \
            docker login "$INITPAD_REGISTRY" -u "$INITPAD_REGISTRY_USER" --password-stdin
      - name: test
        run: |
          docker build --target test --provenance=false \
            --cache-from "type=registry,ref=$CACHE" \
            .
      - name: build image
        run: |
          docker build --provenance=false -t "$IMAGE" \
            --cache-from "type=registry,ref=$CACHE" \
            --cache-to "type=registry,ref=$CACHE,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" \
            .
      - name: publish image
        run: docker push "$IMAGE"
      # Always report the result, so a failure cannot leave dev stuck in
      # "deploying" while no callback will ever arrive.
      - name: notify platform
        if: always()
        env:
          CI_RESULT: ${{ job.status }}
          INITPAD_PLATFORM_URL: ${{ secrets.INITPAD_PLATFORM_URL }}
          INITPAD_DEPLOY_TOKEN: ${{ secrets.INITPAD_DEPLOY_TOKEN }}
        run: |
          jq -n --arg repo "$CI_REPOSITORY" --arg sha "$CI_SHA" --arg ref "$CI_REF" \
            --arg ciStatus "$CI_RESULT" '$ARGS.named' |
            curl -fsS -X POST "$INITPAD_PLATFORM_URL/api/ci/deploy" \
              -H "Authorization: Bearer $INITPAD_DEPLOY_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @-
          test "$CI_RESULT" = "success"
