name: ci
on: [push]

# The pipeline is split into jobs so that each maps to one stage in the
# platform (build → test → docker build → deploy). Gitea creates a commit
# status per job; the platform reads these to render the pipeline view.
#
# Note: Node and npm ship inside the runner image
# (catthehacker/ubuntu:act-latest), so actions/setup-node is intentionally
# not used — it downloads from github.com and is the most common source of
# failures on an unstable network.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: mark CI as started
        run: |
          # The push may win a short race with InitPad's project transaction.
          # Retry only this progress signal; a failure must not block the build.
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 3 -X POST "${{ secrets.INITPAD_PLATFORM_URL }}/api/ci/start" \
              -H "Authorization: Bearer ${{ secrets.INITPAD_DEPLOY_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"repo":"${{ github.repository }}","sha":"${{ github.sha }}","ref":"${{ github.ref_name }}"}'; then
              exit 0
            fi
            [ "$attempt" -eq 6 ] || sleep 2
          done
          echo "::warning::InitPad progress callback failed"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node --version && npm --version
      - run: npm ci

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm ci
      - run: npm test

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # Build once, deploy many: the image is built ONCE and pushed to the
      # Gitea registry tagged with the commit hash. The platform then only
      # pulls and runs it (dev/test/prod = the same image). The registry host
      # comes from an Actions secret set by the platform at repo creation, so
      # the workflow contains no hard-coded addresses.
      - name: build & push image
        run: |
          IMAGE=$(echo "${{ secrets.INITPAD_REGISTRY }}/${{ github.repository }}:${{ github.sha }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.INITPAD_REGISTRY_PASSWORD }}" | \
            docker login "${{ secrets.INITPAD_REGISTRY }}" -u "${{ secrets.INITPAD_REGISTRY_USER }}" --password-stdin
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    # Always notify InitPad so an upstream failure cannot leave dev stuck
    # in "deploying" while no callback will ever arrive.
    if: always()
    steps:
      # After a successful build, tell the platform to deploy this commit to
      # dev. The platform URL and the token come from Actions secrets set by
      # the platform at repo creation.
      - name: notify platform
        run: |
          curl -fsS -X POST "${{ secrets.INITPAD_PLATFORM_URL }}/api/ci/deploy" \
            -H "Authorization: Bearer ${{ secrets.INITPAD_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"repo":"${{ github.repository }}","sha":"${{ github.sha }}","ref":"${{ github.ref_name }}","ciStatus":"${{ needs.docker.result }}"}'
          test "${{ needs.docker.result }}" = "success"
