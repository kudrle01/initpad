name: ci
on: [push]

# One job tests, builds and publishes the image (ADR-139). Each CI job starts on
# a fresh Docker daemon, so separate jobs would each rebuild from scratch.
# The tests run in the image's build stage, so the image cannot exist without
# them passing.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: mark CI as started
        run: |
          # The push may win a short race with InitPad's project transaction.
          # Retry only this progress signal; a failure must not block the build.
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 3 -X POST "${{ secrets.INITPAD_PLATFORM_URL }}/api/ci/start" \
              -H "Authorization: Bearer ${{ secrets.INITPAD_DEPLOY_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"repo":"${{ github.repository }}","sha":"${{ github.sha }}","ref":"${{ github.ref_name }}"}'; then
              exit 0
            fi
            [ "$attempt" -eq 6 ] || sleep 2
          done
          echo "::warning::InitPad progress callback failed"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: prepare image
        run: |
          IMAGE=$(echo "${{ secrets.INITPAD_REGISTRY }}/${{ github.repository }}:${{ github.sha }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          # Build layers are cached next to the image, in this repository's registry.
          echo "CACHE=${IMAGE%:*}:buildcache" >> "$GITHUB_ENV"
          echo "${{ secrets.INITPAD_REGISTRY_PASSWORD }}" | \
            docker login "${{ secrets.INITPAD_REGISTRY }}" -u "${{ secrets.INITPAD_REGISTRY_USER }}" --password-stdin
      - name: test
        run: |
          docker build --target test --provenance=false \
            --cache-from "type=registry,ref=$CACHE" \
            .
      - name: build image
        run: |
          docker build --provenance=false -t "$IMAGE" \
            --cache-from "type=registry,ref=$CACHE" \
            --cache-to "type=registry,ref=$CACHE,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" \
            .
      - name: publish image
        run: docker push "$IMAGE"
      # Always report the result, so a failure cannot leave dev stuck in
      # "deploying" while no callback will ever arrive.
      - name: notify platform
        if: always()
        run: |
          curl -fsS -X POST "${{ secrets.INITPAD_PLATFORM_URL }}/api/ci/deploy" \
            -H "Authorization: Bearer ${{ secrets.INITPAD_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"repo":"${{ github.repository }}","sha":"${{ github.sha }}","ref":"${{ github.ref_name }}","ciStatus":"${{ job.status }}"}'
          test "${{ job.status }}" = "success"
