name: ci
on: [push]

# Pipeline je rozdělená na joby, aby každý odpovídal jedné stage v platformě
# (build → test → docker build → deploy). Gitea pro každý job vytvoří commit
# status, který platforma čte a zobrazuje v detailu projektu.
#
# Pozn.: Node i npm jsou už v runner image (catthehacker/ubuntu:act-latest),
# proto nepoužíváme actions/setup-node (to se tahá z github.com a bývá
# nejčastější příčina selhání na nestabilní síti).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --version && npm --version
      - run: npm install

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm test

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t initpad-ci:${{ github.sha }} .

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      # Po úspěšném buildu řekne platformě, ať stáhne tento commit a nasadí dev.
      # host.docker.internal = API platformy na hostu; token = Actions secret,
      # který platforma nastavila při založení repa.
      - name: notify platform
        run: |
          curl -fsS -X POST http://host.docker.internal:3000/api/ci/deploy \
            -H "Authorization: Bearer ${{ secrets.INITPAD_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"repo":"${{ github.repository }}","sha":"${{ github.sha }}","ref":"${{ github.ref_name }}"}'
