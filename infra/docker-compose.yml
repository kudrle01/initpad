# Development stack: platform-api/web run outside compose via `npm run dev`;
# the services below provide Git hosting, CI, persistence, object storage and
# the simulated deployment targets. Start and bootstrap it with
# ./infra/dev-setup.sh (see README, Lokální vývoj).
#
# A separate Compose project with its own volumes and ports (Gitea 3002,
# static web 8086, S3 9100), so it runs next to a deploy/ installation
# without touching its data (ADR-175).

name: initpad-dev

services:
  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_USER: initpad
      POSTGRES_PASSWORD: initpad
      POSTGRES_DB: initpad
    ports:
      - "${INITPAD_DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [platform]

  gitea:
    image: gitea/gitea:1.22@sha256:538658de667c5d098a274f2f63aa6ec891d88f670cdd5282cf27221ba747dda4
    environment:
      # No web install wizard: dev-setup.sh creates the service account.
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://gitea.localhost:3002/
      # Enables Gitea Actions (CI). The runner registers below (profile "ci").
      GITEA__actions__ENABLED: "true"
      # SSO: signing in through the platform (OIDC) auto-links to an existing
      # account by e-mail; unknown e-mails get a new account (username = claim).
      GITEA__oauth2_client__ACCOUNT_LINKING: auto
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__USERNAME: nickname
      GITEA__service__DISABLE_REGISTRATION: "true"
      # Allow webhook deliveries only to the host-side development API.
      GITEA__webhook__ALLOWED_HOST_LIST: "host.docker.internal"
    ports:
      - "3002:3000"
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
    # Gitea calls the platform API on the host via host.docker.internal (SSO,
    # webhooks). Docker Desktop provides the name; on plain Linux dev-setup.sh
    # adds docker-compose.linux.yml, which maps it to the host gateway.
    networks: [platform]

  # S3-compatible object storage for verified build artifacts (ADR-059,
  # ADR-163), the same SeaweedFS gateway as the deploy/ stack.
  s3:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    command: server -dir=/data -s3 -s3.port=9000 -ip.bind=0.0.0.0 -volume.max=5
    environment:
      AWS_ACCESS_KEY_ID: ${INITPAD_DEV_S3_ACCESS_KEY_ID:-initpad}
      AWS_SECRET_ACCESS_KEY: ${INITPAD_DEV_S3_SECRET_ACCESS_KEY:-initpad-dev-artifacts}
    ports:
      - "127.0.0.1:9100:9000"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9333/cluster/status >/dev/null && curl -fsS http://localhost:9000/status >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [platform]

  s3-init:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    depends_on:
      s3: { condition: service_healthy }
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until echo "s3.bucket.create -name initpad-artifacts" | weed shell -master=s3:9333 2>&1 | grep -Eq "created bucket|already exists"; do
          echo "waiting for the object store..."; sleep 2;
        done
    networks: [platform]
    restart: "no"

  # Gitea Actions runner — executes workflows in a dedicated rootless Docker
  # daemon. A compromised workflow cannot control the host Docker daemon.
  # Profile "ci": ./infra/dev-setup.sh ci registers and starts it.
  runner-docker:
    image: docker:27.5.1-dind-rootless@sha256:e2ac8e8f66ae21a060b0a8e3005c70f6ed9441aabf409434463d1f6eecd38026
    profiles: ["ci"]
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
      DOCKER_HOST: tcp://127.0.0.1:2375
    command:
      - "--host=tcp://0.0.0.0:2375"
      - "--tls=false"
      - "--insecure-registry=host.docker.internal:3002"
      # Template workflows export their build cache to the project registry,
      # which needs the containerd image store (ADR-139).
      - "--feature=containerd-snapshotter=true"
    volumes:
      - runner-docker-data:/home/rootless/.local/share/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    extra_hosts:
      # Keep the nested daemon on the dedicated ci-control gateway. Docker's
      # generic host-gateway can point at an unrelated 172.17.0.1 bridge.
      - "host.docker.internal:172.31.250.1"
      - "gitea.localhost:172.31.250.1"
    networks: [ci-control]
    restart: unless-stopped

  act_runner:
    image: gitea/act_runner:0.2.13@sha256:8477d5b61b655caad4449888bae39f1f34bebd27db56cb15a62dccb3dcf3a944
    profiles: ["ci"]
    depends_on:
      gitea: { condition: service_started }
      runner-docker: { condition: service_healthy }
    environment:
      GITEA_INSTANCE_URL: ${INITPAD_GITEA_RUNNER_URL:-http://host.docker.internal:3002}
      GITEA_RUNNER_REGISTRATION_TOKEN: ${INITPAD_RUNNER_TOKEN:-}
      GITEA_RUNNER_NAME: initpad-runner
      # Labels are written AT REGISTRATION TIME and the image reads them from
      # here (not from config.yaml). Must include "ubuntu-latest" because the
      # workflows use runs-on: ubuntu-latest.
      GITEA_RUNNER_LABELS: "ubuntu-latest:docker://catthehacker/ubuntu:act-latest@sha256:c58e2b364da03b0c804c7d660f2ecbedf2f221a382b9baa0b344b0144780ff43"
      CONFIG_FILE: /config.yaml
    volumes:
      - ./act_runner/config.yaml:/config.yaml:ro
      - runner-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [platform, ci-control]
    restart: unless-stopped

  # --- simulated deployment targets (real protocols against stand-in containers) ---

  # SFTP target for static/PHP applications. The platform uploads releases
  # here over SFTP; the content (per-project symlinks) is served by the nginx
  # service below. The volume is shared with nginx.
  sftp-volume-init:
    image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    command:
      - /bin/sh
      - -ec
      - |
        touch /data/.initpad-volume
        chown -R 1000:100 /data
        chmod 0755 /data
    volumes:
      - sftp-www:/data
    restart: "no"

  fake-sftp:
    image: atmoz/sftp:latest@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475
    command: deploy:deploy:::www
    ports:
      - "2222:22" # SFTP reachable from the API on the host (config.providers.sftp.port)
    volumes:
      - sftp-www:/home/deploy/www
    depends_on:
      sftp-volume-init: { condition: service_completed_successfully }
    networks: [net-prod]

  # Serves the uploaded static content (releases published via symlinks).
  static-web:
    image: nginx:alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    depends_on: [fake-sftp]
    ports:
      - "8086:80" # INITPAD_SFTP_PUBLIC_URL in apps/api/.env
    volumes:
      - sftp-www:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [net-prod]

volumes:
  pgdata: {}
  s3-data: {}
  gitea-data: {}
  runner-data: {}
  runner-docker-data: {}
  sftp-www: {}

networks:
  platform: {}
  ci-control:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          gateway: 172.31.250.1
  net-dev: {}
  net-test: {}
  net-prod: {}
