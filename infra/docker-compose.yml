# Simulované prostředí „firmy" na jednom stroji.
# Stav: kostra (F2). platform-api/web jedou i bez compose přes `npm run dev`.
# Služby gitea/postgres/fake-* se zapojují postupně (F2–F3).

name: initpad

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: initpad
      POSTGRES_PASSWORD: initpad
      POSTGRES_DB: initpad
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [platform]

  gitea:
    image: gitea/gitea:1.22
    environment:
      GITEA__server__ROOT_URL: http://localhost:3001/
      # Zapne Gitea Actions (CI). Runner se registruje níže (profil "ci").
      GITEA__actions__ENABLED: "true"
      # SSO: přihlášení přes platformu (OIDC) se automaticky spáruje s existujícím
      # účtem podle e-mailu; pro neznámé e-maily založí účet (username = claim).
      GITEA__oauth2_client__ACCOUNT_LINKING: auto
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__USERNAME: nickname
    ports:
      - "3001:3000"
    volumes:
      - gitea-data:/data
    # Gitea (z kontejneru) volá API platformy na hostu přes host.docker.internal
    # (SSO discovery/token/userinfo). Na Docker Desktop (Mac/Windows) je k dispozici
    # nativně – NEPŘIDÁVAT extra_hosts host-gateway, to ho na Macu rozbije.
    # (Na čistém Linuxu odkomentuj:)
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    networks: [platform]

  # Gitea Actions runner – spouští vygenerovaný .gitea/workflows/ci.yml na push.
  # Profil "ci": startuje zvlášť po vygenerování registračního tokenu, viz README.
  #   1) docker compose up -d gitea postgres
  #   2) infra/register-runner.sh            # vytiskne a uloží token do .env
  #   3) docker compose --profile ci up -d act_runner
  act_runner:
    image: gitea/act_runner:0.2.11
    profiles: ["ci"]
    depends_on: [gitea]
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${INITPAD_RUNNER_TOKEN:-}
      GITEA_RUNNER_NAME: initpad-runner
      # Labely se zapisují PŘI REGISTRACI a image je bere odsud (ne z config.yaml).
      # Musí obsahovat "ubuntu-latest", protože workflow má runs-on: ubuntu-latest.
      GITEA_RUNNER_LABELS: "ubuntu-latest:docker://catthehacker/ubuntu:act-latest"
      CONFIG_FILE: /config.yaml
    volumes:
      - ./act_runner/config.yaml:/config.yaml:ro
      - runner-data:/data
      # Sdílený Docker daemon – aby krok "docker build" v CI reálně postavil image.
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [platform]
    restart: unless-stopped

  # --- simulované cíle nasazení (reálné protokoly proti stand-in kontejnerům) ---

  # SFTP cíl pro statické/PHP aplikace. Platforma sem přes SFTP nahraje release;
  # obsah (symlink `current`) servíruje nginx níže. Volume sdílí s nginxem.
  fake-sftp:
    image: atmoz/sftp
    command: deploy:deploy:::www
    ports:
      - "2222:22" # SFTP dosažitelné z API na hostu (config.providers.sftp.port)
    volumes:
      - sftp-www:/home/deploy/www
    networks: [net-prod]

  # Servíruje nahraný statický obsah (release přepnutý symlinkem `current`).
  static-web:
    image: nginx:alpine
    depends_on: [fake-sftp]
    ports:
      - "8085:80" # config.providers.sftp.publicUrl
    volumes:
      - sftp-www:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [net-prod]

  # SSH cíl pro runtime aplikace (Node). Vlastní image = openssh-server + Node.
  fake-vps:
    build: ./fake-vps
    environment:
      PUID: "1000"
      PGID: "1000"
      USER_NAME: deploy
      USER_PASSWORD: deploy
      PASSWORD_ACCESS: "true"
      SUDO_ACCESS: "false"
    ports:
      - "2200:2222" # SSH dosažitelné z API na hostu (config.providers.ssh.port)
      # App porty publikované 1:1 → funkční URL a health check z hostu
      # (config.providers.ssh.appPortBase/appPortSlots).
      - "8090-8099:8090-8099"
    networks: [net-prod]

volumes:
  pgdata: {}
  gitea-data: {}
  runner-data: {}
  sftp-www: {}

networks:
  platform: {}
  net-dev: {}
  net-test: {}
  net-prod: {}
