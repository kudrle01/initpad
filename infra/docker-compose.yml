# Simulated "company" environment on a single machine.
# platform-api/web run outside compose via `npm run dev`; the services below
# provide Git hosting, CI, persistence and the simulated deployment targets.

name: initpad

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: initpad
      POSTGRES_PASSWORD: initpad
      POSTGRES_DB: initpad
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [platform]

  gitea:
    image: gitea/gitea:1.22
    environment:
      GITEA__server__ROOT_URL: http://localhost:3001/
      # Enables Gitea Actions (CI). The runner registers below (profile "ci").
      GITEA__actions__ENABLED: "true"
      # SSO: signing in through the platform (OIDC) auto-links to an existing
      # account by e-mail; unknown e-mails get a new account (username = claim).
      GITEA__oauth2_client__ACCOUNT_LINKING: auto
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__USERNAME: nickname
    ports:
      - "3001:3000"
    volumes:
      - gitea-data:/data
    # Gitea (inside its container) calls the platform API on the host via
    # host.docker.internal (SSO discovery/token/userinfo). Docker Desktop
    # (Mac/Windows) provides it natively — do NOT add the host-gateway
    # extra_hosts entry there, it breaks the name on macOS.
    # (On plain Linux, uncomment:)
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    networks: [platform]

  # Gitea Actions runner — executes the generated .gitea/workflows/ci.yml on push.
  # Profile "ci": started separately after generating a registration token:
  #   1) docker compose up -d gitea postgres
  #   2) infra/register-runner.sh            # prints the token
  #   3) docker compose --profile ci up -d act_runner
  act_runner:
    image: gitea/act_runner:0.2.11
    profiles: ["ci"]
    depends_on: [gitea]
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${INITPAD_RUNNER_TOKEN:-}
      GITEA_RUNNER_NAME: initpad-runner
      # Labels are written AT REGISTRATION TIME and the image reads them from
      # here (not from config.yaml). Must include "ubuntu-latest" because the
      # workflows use runs-on: ubuntu-latest.
      GITEA_RUNNER_LABELS: "ubuntu-latest:docker://catthehacker/ubuntu:act-latest"
      CONFIG_FILE: /config.yaml
    volumes:
      - ./act_runner/config.yaml:/config.yaml:ro
      - runner-data:/data
      # Shared Docker daemon — so the CI "docker build" step really builds
      # images on the host.
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [platform]
    restart: unless-stopped

  # --- simulated deployment targets (real protocols against stand-in containers) ---

  # SFTP target for static/PHP applications. The platform uploads releases
  # here over SFTP; the content (per-project symlinks) is served by the nginx
  # service below. The volume is shared with nginx.
  fake-sftp:
    image: atmoz/sftp
    command: deploy:deploy:::www
    ports:
      - "2222:22" # SFTP reachable from the API on the host (config.providers.sftp.port)
    volumes:
      - sftp-www:/home/deploy/www
    networks: [net-prod]

  # Serves the uploaded static content (releases published via symlinks).
  static-web:
    image: nginx:alpine
    depends_on: [fake-sftp]
    ports:
      - "8085:80" # config.providers.sftp.publicUrl
    volumes:
      - sftp-www:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [net-prod]

  # SSH target for runtime applications (Node). Custom image = openssh-server + Node.
  fake-vps:
    build: ./fake-vps
    environment:
      PUID: "1000"
      PGID: "1000"
      USER_NAME: deploy
      USER_PASSWORD: deploy
      PASSWORD_ACCESS: "true"
      SUDO_ACCESS: "false"
    ports:
      - "2200:2222" # SSH reachable from the API on the host (config.providers.ssh.port)
      # App ports published 1:1 → working URLs and health checks from the
      # host. Ports are allocated per environment from the database
      # (config.providers.ssh.appPortBase/appPortSlots must match this range).
      - "8090-8189:8090-8189"
    networks: [net-prod]

volumes:
  pgdata: {}
  gitea-data: {}
  runner-data: {}
  sftp-www: {}

networks:
  platform: {}
  net-dev: {}
  net-test: {}
  net-prod: {}
