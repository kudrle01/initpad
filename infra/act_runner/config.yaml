# Gitea Actions runner configuration. Jobs use a dedicated rootless DinD
# daemon; the host Docker socket is deliberately never exposed to workflows.
log:
  level: info

runner:
  # The "ubuntu-latest" label must match `runs-on:` in the workflows.
  # The catthehacker image ships the Docker CLI (needed for `docker build`).
  labels:
    - "ubuntu-latest:docker://catthehacker/ubuntu:act-latest"
  capacity: 1
  timeout: 30m
  shutdown_timeout: 2m

container:
  network: "bridge"
  privileged: false
  # *.localhost resolves to the physical loopback in a browser. Inside CI it
  # is mapped to the dedicated outer gateway, while Docker commands talk only
  # to the nested daemon through its bridge gateway.
  options: "--add-host=gitea.localhost:172.31.250.1 --add-host=platform.localhost:172.31.250.1 --env=DOCKER_HOST=tcp://172.17.0.1:2375 --security-opt=no-new-privileges"
  valid_volumes: []
  docker_host: "tcp://runner-docker:2375"
  force_pull: true
