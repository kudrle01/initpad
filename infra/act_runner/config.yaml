# Gitea Actions runner (act_runner) configuration.
# The runner mounts the Docker socket into job containers BY ITSELF — do not
# list it here, or docker reports "Duplicate mount point". Thanks to the
# socket, the `docker build` step in the generated ci.yml builds images on
# the host daemon.
log:
  level: info

runner:
  # The "ubuntu-latest" label must match `runs-on:` in the workflows.
  # The catthehacker image ships the Docker CLI (needed for `docker build`).
  labels:
    - "ubuntu-latest:docker://catthehacker/ubuntu:act-latest"

container:
  # Attach job containers to the same network as Gitea so the internal
  # hostname "gitea" resolves (checkout clones from http://gitea:3000).
  # Network name = <compose project>_<network> = initpad_platform.
  network: "initpad_platform"
  privileged: false
