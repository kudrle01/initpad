# Serves deployed static sites (shared volume with fake-sftp).
# Each project has a symlink <owner>-<project>-<env> → <…>-releases/<version>
# in the volume root; the URL is /<symlink>/… Switching versions = re-pointing
# the symlink (atomic release, no nginx restart needed).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Root without a project — a friendly message instead of a 403/404.
    location = / {
        default_type text/plain;
        return 200 "InitPad static host. Deployed sites are served under /<owner>-<project>-<env>/.\n";
    }

    # Project files; unknown paths fall back to the project's index.html
    # (SPA fallback for client-side routing).
    location ~ ^/(?<proj>[^/]+) {
        try_files $uri $uri/ /$proj/index.html;
    }
}
