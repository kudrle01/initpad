# Servíruje aktuální release nahraný přes SFTP (symlink `current` → releases/<v>).
# Symlinky jsou povolené (výchozí), takže přepnutí verze se projeví bez restartu.
server {
    listen 80;
    server_name _;

    # Kořen je symlink na aktuální release ve sdíleném volume s fake-sftp.
    root /usr/share/nginx/html/current;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dokud neproběhl první deploy, symlink neexistuje → srozumitelná hláška.
    error_page 404 =200 /_initpad_empty;
    location = /_initpad_empty {
        default_type text/plain;
        return 200 "InitPad static host: no release deployed yet.\n";
    }
}
