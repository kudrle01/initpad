name: Set up age
description: Installs the pinned, checksum-verified age release used by the encrypted backup test.

runs:
  using: composite
  steps:
    # A pinned release instead of apt: the same version on every runner, no
    # package index refresh, and a checksum that fails on a swapped archive.
    - name: Install age
      shell: bash
      env:
        AGE_VERSION: v1.3.2
        AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
      run: |
        set -euo pipefail
        [[ "${RUNNER_OS}-${RUNNER_ARCH}" == "Linux-X64" ]] || {
          echo "setup-age pins the linux-amd64 archive, not ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1;
        }
        archive="${RUNNER_TEMP}/age.tar.gz"
        curl -fsSL --retry 3 -o "${archive}" \
          "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
        echo "${AGE_SHA256}  ${archive}" | sha256sum --check --strict -
        mkdir -p "${RUNNER_TEMP}/age"
        tar -xzf "${archive}" -C "${RUNNER_TEMP}/age" --strip-components=1
        echo "${RUNNER_TEMP}/age" >> "${GITHUB_PATH}"
        "${RUNNER_TEMP}/age/age-keygen" --version
