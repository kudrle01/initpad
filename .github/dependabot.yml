version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Prague
    groups:
      npm-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: docker
    directories:
      - /apps/*
      - /templates/*/files
      - /infra/fake-vps
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Prague
    groups:
      dockerfile-images:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(images)

  - package-ecosystem: docker-compose
    directories:
      - /deploy
      - /infra
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Prague
    groups:
      compose-images:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(images)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Prague
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(actions)
