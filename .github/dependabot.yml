version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Prague
    groups:
      npm-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)

  # Generated projects inherit the template dependencies. JavaScript templates
  # keep a templated package.json, so their lockfiles reach GitHub's
  # dependency graph and security alerts, but not version updates.
  - package-ecosystem: pip
    directories:
      - /templates/django/files
      - /templates/fastapi/files
      - /templates/flask/files
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Prague
    groups:
      template-python:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(templates)

  - package-ecosystem: composer
    directories:
      - /templates/laravel/files
      - /templates/nette/files
      - /templates/symfony/files
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
      timezone: Europe/Prague
    groups:
      template-php:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(templates)

  - package-ecosystem: docker
    directories:
      - /apps/*
      - /templates/*/files
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Prague
    groups:
      dockerfile-images:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(images)

  - package-ecosystem: docker-compose
    directories:
      - /deploy
      - /infra
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Prague
    groups:
      compose-images:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(images)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Prague
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(actions)
