name: Verify container images

on:
  push:
    branches: [main]
    paths:
      - 'apps/*/Dockerfile'
      - 'apps/web/nginx*.conf'
      - 'apps/*/package.json'
      - 'templates/**'
      - 'deploy/*.yml'
      - 'infra/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/test-template-images.sh'
      - '.trivyignore.yaml'
      - '.github/dependabot.yml'
      - '.github/workflows/container-images.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/*/Dockerfile'
      - 'apps/web/nginx*.conf'
      - 'apps/*/package.json'
      - 'templates/**'
      - 'deploy/*.yml'
      - 'infra/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/test-template-images.sh'
      - '.trivyignore.yaml'
      - '.github/dependabot.yml'
      - '.github/workflows/container-images.yml'
  # New advisories appear without a change in this repository.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: container-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build platform and template images
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build platform runtime images
        run: |
          docker build --pull -f apps/api/Dockerfile -t initpad-api:acceptance .
          docker build --pull -f apps/web/Dockerfile -t initpad-web:acceptance .
          docker build --pull -f apps/agent/Dockerfile -t initpad-agent:acceptance .
          docker build --pull -f apps/supervisor/Dockerfile -t initpad-supervisor:acceptance .

      # ADR-144: a fixed HIGH or CRITICAL vulnerability in a platform image
      # or in a template lockfile fails the build. Accepted findings, each with
      # an expiry, are in .trivyignore.yaml.
      - name: Scan platform images and template dependencies
        shell: bash
        env:
          TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        run: |
          set -euo pipefail
          trivy() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v initpad-trivy-cache:/root/.cache \
              -v "$PWD:/src:ro" \
              "$TRIVY_IMAGE" "$@" \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --ignorefile /src/.trivyignore.yaml --exit-code 1 --no-progress
          }
          for image in api web agent supervisor; do
            trivy image "initpad-${image}:acceptance"
          done
          trivy fs --include-dev-deps /src/templates

      - name: Probe Agent runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "require('./apps/agent/package.json').version")"
          actual="$(docker run --rm initpad-agent:acceptance version)"
          test "${actual}" = "${expected}"

      - name: Build and probe every project template
        run: ./scripts/test-template-images.sh
