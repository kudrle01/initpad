name: Verify container images

# Runs on every pull request so that "Container images" can be a required
# check of the main ruleset; the gate job passes as a no-op when no image input
# changed (scripts/container-image-inputs.mjs).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # New advisories appear without a change in this repository.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: container-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect image inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.inputs.outputs.images }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare with the base revision
        id: inputs
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A schedule, a manual run or an unknown base checks everything.
          if [[ "${GITHUB_EVENT_NAME}" != pull_request && "${GITHUB_EVENT_NAME}" != push ]] \
            || [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]] \
            || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            images=true
          else
            images="$(git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}" | node scripts/container-image-inputs.mjs)"
          fi
          echo "Image inputs changed: ${images}"
          echo "images=${images}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build platform and template images
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Docker Hub limits anonymous pulls and a 429 failed this build once. The
      # pinned digests are the same on the mirror; the daemon falls back to
      # Docker Hub for anything the mirror does not have.
      - name: Pull Docker Hub images through a mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker

      - name: Build platform runtime images
        run: |
          docker build --pull -f apps/api/Dockerfile -t initpad-api:acceptance .
          docker build --pull -f apps/web/Dockerfile -t initpad-web:acceptance .
          docker build --pull -f apps/agent/Dockerfile -t initpad-agent:acceptance .
          docker build --pull -f apps/supervisor/Dockerfile -t initpad-supervisor:acceptance .

      # ADR-144: a fixed HIGH or CRITICAL vulnerability in a platform image
      # or in a template lockfile fails the build. Accepted findings, each with
      # an expiry, are in .trivyignore.yaml.
      - name: Scan platform images and template dependencies
        shell: bash
        env:
          TRIVY_IMAGE: mirror.gcr.io/aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        run: |
          set -euo pipefail
          trivy() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v initpad-trivy-cache:/root/.cache \
              -v "$PWD:/src:ro" \
              "$TRIVY_IMAGE" "$@" \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --ignorefile /src/.trivyignore.yaml --exit-code 1 --no-progress
          }
          for image in api web agent supervisor; do
            trivy image "initpad-${image}:acceptance"
          done
          trivy fs --include-dev-deps /src/templates

      - name: Probe Agent runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "require('./apps/agent/package.json').version")"
          actual="$(docker run --rm initpad-agent:acceptance version)"
          test "${actual}" = "${expected}"

      - name: Build and probe every project template
        run: ./scripts/test-template-images.sh

  gate:
    # The required check: passes when the images were built and scanned, or
    # when the change touched no image input at all.
    name: Container images
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require verified images for image changes
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          IMAGES: ${{ needs.changes.outputs.images }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          [[ "${CHANGES_RESULT}" == success ]] || { echo "Input detection ${CHANGES_RESULT}" >&2; exit 1; }
          if [[ "${IMAGES}" == true ]]; then
            [[ "${BUILD_RESULT}" == success ]] || { echo "Image verification ${BUILD_RESULT}" >&2; exit 1; }
          else
            [[ "${BUILD_RESULT}" == skipped ]] || { echo "Unexpected build ${BUILD_RESULT}" >&2; exit 1; }
            echo 'No image input changed; nothing to verify.'
          fi
