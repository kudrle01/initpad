name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      # Blocks a pull request that adds a dependency with a known advisory,
      # before it reaches main and the Dependabot alert list.
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development
          comment-summary-in-pr: on-failure
          show-patched-versions: true
