name: Release InitPad Platform

on:
  push:
    tags:
      - 'initpad-v*'

concurrency:
  group: platform-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build, sign and publish platform
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Verify source and release gate
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./deploy/platform-version.json').version")"
          supervisor_version="$(node -p "require('./apps/supervisor/package.json').version")"
          expected_tag="initpad-v${version}"
          [[ "${GITHUB_REF_NAME}" == "${expected_tag}" ]] || {
            echo "Expected tag ${expected_tag}, received ${GITHUB_REF_NAME}" >&2; exit 1;
          }
          [[ "${supervisor_version}" == "${version}" ]] || {
            echo "Supervisor ${supervisor_version} does not match platform ${version}" >&2; exit 1;
          }
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "PLATFORM_VERSION=${version}"
            echo "API_IMAGE=ghcr.io/${owner}/initpad-api"
            echo "WEB_IMAGE=ghcr.io/${owner}/initpad-web"
            echo "SUPERVISOR_IMAGE=ghcr.io/${owner}/initpad-supervisor"
          } >> "${GITHUB_ENV}"
          npm ci
          npm run check:release

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse existing immutable version tags
        shell: bash
        run: |
          set -euo pipefail
          for image in "${API_IMAGE}" "${WEB_IMAGE}" "${SUPERVISOR_IMAGE}"; do
            if docker buildx imagetools inspect "${image}:${PLATFORM_VERSION}" >/dev/null 2>&1; then
              echo "${image}:${PLATFORM_VERSION} already exists; releases are immutable" >&2
              exit 1
            fi
          done

      - name: Build and push API
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.PLATFORM_VERSION }}
            ${{ env.API_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.PLATFORM_VERSION }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=initpad-platform-api
          cache-to: type=gha,mode=max,scope=initpad-platform-api

      - name: Build and push web
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.PLATFORM_VERSION }}
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.PLATFORM_VERSION }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=initpad-platform-web
          cache-to: type=gha,mode=max,scope=initpad-platform-web

      - name: Build and push Supervisor
        id: supervisor
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/supervisor/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            ${{ env.SUPERVISOR_IMAGE }}:${{ env.PLATFORM_VERSION }}
            ${{ env.SUPERVISOR_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.PLATFORM_VERSION }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=initpad-platform-supervisor
          cache-to: type=gha,mode=max,scope=initpad-platform-supervisor

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify immutable images
        shell: bash
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          SUPERVISOR_DIGEST: ${{ steps.supervisor.outputs.digest }}
        run: |
          set -euo pipefail
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release-platform.yml@refs/tags/${GITHUB_REF_NAME}"
          for reference in \
            "${API_IMAGE}@${API_DIGEST}" \
            "${WEB_IMAGE}@${WEB_DIGEST}" \
            "${SUPERVISOR_IMAGE}@${SUPERVISOR_DIGEST}"; do
            cosign sign --yes "${reference}"
            cosign verify \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${reference}" >/dev/null
          done

      - name: Prepare and sign release assets
        id: assets
        shell: bash
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          SUPERVISOR_DIGEST: ${{ steps.supervisor.outputs.digest }}
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/initpad-platform-release"
          for component in api web supervisor; do
            image_variable="$(printf '%s_IMAGE' "${component}" | tr '[:lower:]' '[:upper:]')"
            digest_variable="$(printf '%s_DIGEST' "${component}" | tr '[:lower:]' '[:upper:]')"
            docker buildx imagetools inspect "${!image_variable}@${!digest_variable}" \
              --format '{{ json .SBOM }}' > "${RUNNER_TEMP}/${component}-sbom.json"
          done
          node scripts/prepare-platform-release.mjs \
            --output "${release_dir}" \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --api-image "${API_IMAGE}" --api-digest "${API_DIGEST}" \
            --web-image "${WEB_IMAGE}" --web-digest "${WEB_DIGEST}" \
            --supervisor-image "${SUPERVISOR_IMAGE}" --supervisor-digest "${SUPERVISOR_DIGEST}" \
            --api-sbom "${RUNNER_TEMP}/api-sbom.json" \
            --web-sbom "${RUNNER_TEMP}/web-sbom.json" \
            --supervisor-sbom "${RUNNER_TEMP}/supervisor-sbom.json"
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release-platform.yml@refs/tags/${GITHUB_REF_NAME}"
          for asset in "${release_dir}"/*; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "${asset}"
            cosign verify-blob \
              --bundle "${asset}.sigstore.json" \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${asset}" >/dev/null
          done
          echo "directory=${release_dir}" >> "${GITHUB_OUTPUT}"

      - name: Add GitHub API image provenance when supported
        if: ${{ github.event.repository.visibility == 'public' || vars.INITPAD_ENABLE_PRIVATE_ATTESTATIONS == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Add GitHub web image provenance when supported
        if: ${{ github.event.repository.visibility == 'public' || vars.INITPAD_ENABLE_PRIVATE_ATTESTATIONS == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true

      - name: Add GitHub Supervisor image provenance when supported
        if: ${{ github.event.repository.visibility == 'public' || vars.INITPAD_ENABLE_PRIVATE_ATTESTATIONS == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.SUPERVISOR_IMAGE }}
          subject-digest: ${{ steps.supervisor.outputs.digest }}
          push-to-registry: true

      - name: Add GitHub release-asset provenance when supported
        if: ${{ github.event.repository.visibility == 'public' || vars.INITPAD_ENABLE_PRIVATE_ATTESTATIONS == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ steps.assets.outputs.directory }}/SHA256SUMS

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DIRECTORY: ${{ steps.assets.outputs.directory }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" "${RELEASE_DIRECTORY}"/* \
            --verify-tag \
            --title "InitPad ${PLATFORM_VERSION}" \
            --generate-notes
          {
            echo '## InitPad platform release'
            echo
            echo 'API, web and Supervisor images are digest-pinned and signed.'
            echo 'Every downloadable asset is covered by the signed checksum manifest.'
          } >> "${GITHUB_STEP_SUMMARY}"
