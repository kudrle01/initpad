name: Release InitPad Platform

on:
  push:
    tags:
      - 'initpad-v*'

concurrency:
  group: platform-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      platform-version: ${{ steps.release.outputs.platform-version }}
      api-image: ${{ steps.release.outputs.api-image }}
      web-image: ${{ steps.release.outputs.web-image }}
      supervisor-image: ${{ steps.release.outputs.supervisor-image }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Verify source and release gate
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./deploy/platform-version.json').version")"
          supervisor_version="$(node -p "require('./apps/supervisor/package.json').version")"
          expected_tag="initpad-v${version}"
          [[ "${GITHUB_REF_NAME}" == "${expected_tag}" ]] || {
            echo "Expected tag ${expected_tag}, received ${GITHUB_REF_NAME}" >&2; exit 1;
          }
          [[ "${supervisor_version}" == "${version}" ]] || {
            echo "Supervisor ${supervisor_version} does not match platform ${version}" >&2; exit 1;
          }
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          api_image="ghcr.io/${owner}/initpad-api"
          web_image="ghcr.io/${owner}/initpad-web"
          supervisor_image="ghcr.io/${owner}/initpad-supervisor"
          {
            echo "platform-version=${version}"
            echo "api-image=${api_image}"
            echo "web-image=${web_image}"
            echo "supervisor-image=${supervisor_image}"
          } >> "${GITHUB_OUTPUT}"
          npm ci
          npm run check:release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse existing immutable version tags
        shell: bash
        env:
          PLATFORM_VERSION: ${{ steps.release.outputs.platform-version }}
          API_IMAGE: ${{ steps.release.outputs.api-image }}
          WEB_IMAGE: ${{ steps.release.outputs.web-image }}
          SUPERVISOR_IMAGE: ${{ steps.release.outputs.supervisor-image }}
        run: |
          set -euo pipefail
          for image in "${API_IMAGE}" "${WEB_IMAGE}" "${SUPERVISOR_IMAGE}"; do
            if docker buildx imagetools inspect "${image}:${PLATFORM_VERSION}" >/dev/null 2>&1; then
              echo "${image}:${PLATFORM_VERSION} already exists; releases are immutable" >&2
              exit 1
            fi
          done

  build_api:
    name: Build API on native runners
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1
    with:
      job-name-prefix: API
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      output: image
      push: true
      sign: 'false'
      context: .
      file: apps/api/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      cache-scope: initpad-platform-api
      sbom: true
      set-meta-labels: true
      meta-images: ${{ needs.verify.outputs.api-image }}
      meta-tags: |
        type=raw,value=${{ needs.verify.outputs.platform-version }}
        type=raw,value=${{ github.sha }}
      meta-labels: |
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.version=${{ needs.verify.outputs.platform-version }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      github-token: ${{ secrets.GITHUB_TOKEN }}

  build_web:
    name: Build web on native runners
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1
    with:
      job-name-prefix: web
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      output: image
      push: true
      sign: 'false'
      context: .
      file: apps/web/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      cache-scope: initpad-platform-web
      sbom: true
      set-meta-labels: true
      meta-images: ${{ needs.verify.outputs.web-image }}
      meta-tags: |
        type=raw,value=${{ needs.verify.outputs.platform-version }}
        type=raw,value=${{ github.sha }}
      meta-labels: |
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.version=${{ needs.verify.outputs.platform-version }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      github-token: ${{ secrets.GITHUB_TOKEN }}

  build_supervisor:
    name: Build Supervisor on native runners
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1
    with:
      job-name-prefix: Supervisor
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      output: image
      push: true
      sign: 'false'
      context: .
      file: apps/supervisor/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      cache-scope: initpad-platform-supervisor
      sbom: true
      set-meta-labels: true
      meta-images: ${{ needs.verify.outputs.supervisor-image }}
      meta-tags: |
        type=raw,value=${{ needs.verify.outputs.platform-version }}
        type=raw,value=${{ github.sha }}
      meta-labels: |
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.version=${{ needs.verify.outputs.platform-version }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      github-token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Sign and publish platform
    needs: [verify, build_api, build_web, build_supervisor]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLATFORM_VERSION: ${{ needs.verify.outputs.platform-version }}
      API_IMAGE: ${{ needs.verify.outputs.api-image }}
      WEB_IMAGE: ${{ needs.verify.outputs.web-image }}
      SUPERVISOR_IMAGE: ${{ needs.verify.outputs.supervisor-image }}
      API_DIGEST: ${{ needs.build_api.outputs.digest }}
      WEB_DIGEST: ${{ needs.build_web.outputs.digest }}
      SUPERVISOR_DIGEST: ${{ needs.build_supervisor.outputs.digest }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify immutable images
        shell: bash
        run: |
          set -euo pipefail
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release-platform.yml@refs/tags/${GITHUB_REF_NAME}"
          for reference in \
            "${API_IMAGE}@${API_DIGEST}" \
            "${WEB_IMAGE}@${WEB_DIGEST}" \
            "${SUPERVISOR_IMAGE}@${SUPERVISOR_DIGEST}"; do
            cosign sign --yes "${reference}"
            cosign verify \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${reference}" >/dev/null
          done

      - name: Prepare and sign release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/initpad-platform-release"
          for component in api web supervisor; do
            image_variable="$(printf '%s_IMAGE' "${component}" | tr '[:lower:]' '[:upper:]')"
            digest_variable="$(printf '%s_DIGEST' "${component}" | tr '[:lower:]' '[:upper:]')"
            docker buildx imagetools inspect "${!image_variable}@${!digest_variable}" \
              --format '{{ json .SBOM }}' > "${RUNNER_TEMP}/${component}-sbom.json"
          done
          node scripts/prepare-platform-release.mjs \
            --output "${release_dir}" \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --api-image "${API_IMAGE}" --api-digest "${API_DIGEST}" \
            --web-image "${WEB_IMAGE}" --web-digest "${WEB_DIGEST}" \
            --supervisor-image "${SUPERVISOR_IMAGE}" --supervisor-digest "${SUPERVISOR_DIGEST}" \
            --api-sbom "${RUNNER_TEMP}/api-sbom.json" \
            --web-sbom "${RUNNER_TEMP}/web-sbom.json" \
            --supervisor-sbom "${RUNNER_TEMP}/supervisor-sbom.json"
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release-platform.yml@refs/tags/${GITHUB_REF_NAME}"
          for asset in "${release_dir}"/*; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "${asset}"
            cosign verify-blob \
              --bundle "${asset}.sigstore.json" \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${asset}" >/dev/null
          done
          echo "directory=${release_dir}" >> "${GITHUB_OUTPUT}"

      - name: Add GitHub API image provenance when supported
        if: ${{ github.event.repository.visibility == 'public' || vars.INITPAD_ENABLE_PRIVATE_ATTESTATIONS == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ env.API_DIGEST }}
          push-to-registry: true

      - name: Add GitHub web image provenance when supported
        if: ${{ github.event.repository.visibility == 'public' || vars.INITPAD_ENABLE_PRIVATE_ATTESTATIONS == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ env.WEB_DIGEST }}
          push-to-registry: true

      - name: Add GitHub Supervisor image provenance when supported
        if: ${{ github.event.repository.visibility == 'public' || vars.INITPAD_ENABLE_PRIVATE_ATTESTATIONS == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.SUPERVISOR_IMAGE }}
          subject-digest: ${{ env.SUPERVISOR_DIGEST }}
          push-to-registry: true

      - name: Add GitHub release-asset provenance when supported
        if: ${{ github.event.repository.visibility == 'public' || vars.INITPAD_ENABLE_PRIVATE_ATTESTATIONS == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ steps.assets.outputs.directory }}/SHA256SUMS

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DIRECTORY: ${{ steps.assets.outputs.directory }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" "${RELEASE_DIRECTORY}"/* \
            --verify-tag \
            --title "InitPad ${PLATFORM_VERSION}" \
            --generate-notes
          {
            echo '## InitPad platform release'
            echo
            echo 'API, web and Supervisor images are digest-pinned and signed.'
            echo 'Every downloadable asset is covered by the signed checksum manifest.'
          } >> "${GITHUB_STEP_SUMMARY}"
