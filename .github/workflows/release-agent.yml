name: Release InitPad Agent

on:
  push:
    tags:
      - 'agent-v*'

concurrency:
  group: agent-release-${{ github.ref }}
  cancel-in-progress: false

# Each job requests only what it uses; the default grants nothing to write.
permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    # Reads GHCR only to refuse a version tag that already exists, and the
    # check runs of the tagged commit for the release gate.
    permissions:
      contents: read
      packages: read
      checks: read
    timeout-minutes: 30
    outputs:
      agent-version: ${{ steps.release.outputs.agent-version }}
      image-name: ${{ steps.release.outputs.image-name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify release source
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/agent/package.json').version")"
          expected_tag="agent-v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Expected tag ${expected_tag}, received ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          image_name="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/initpad-agent"
          {
            echo "agent-version=${version}"
            echo "image-name=${image_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Require the repository gate
        uses: ./.github/actions/release-gate
        with:
          github-token: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing version tag
        shell: bash
        env:
          AGENT_VERSION: ${{ steps.release.outputs.agent-version }}
          IMAGE_NAME: ${{ steps.release.outputs.image-name }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE_NAME}:${AGENT_VERSION}" >/dev/null 2>&1; then
            echo "${IMAGE_NAME}:${AGENT_VERSION} already exists; Agent releases are immutable" >&2
            exit 1
          fi

  # The same native builder as the platform: arm64 builds on an arm64 runner
  # instead of under QEMU emulation.
  build:
    name: Build Agent on native runners
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1
    with:
      job-name-prefix: Agent
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      output: image
      push: true
      sign: 'false'
      context: .
      file: apps/agent/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      cache-scope: initpad-agent
      sbom: true
      set-meta-labels: true
      meta-images: ${{ needs.verify.outputs.image-name }}
      meta-tags: |
        type=raw,value=${{ needs.verify.outputs.agent-version }}
        type=raw,value=${{ github.sha }}
      meta-labels: |
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.version=${{ needs.verify.outputs.agent-version }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      github-token: ${{ secrets.GITHUB_TOKEN }}

  scan:
    name: Scan release image
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 20
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan the pushed digest
        uses: ./.github/actions/scan-release-images
        with:
          references: ${{ needs.verify.outputs.image-name }}@${{ needs.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Sign and publish
    needs: [verify, build, scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    timeout-minutes: 30
    env:
      AGENT_VERSION: ${{ needs.verify.outputs.agent-version }}
      IMAGE_NAME: ${{ needs.verify.outputs.image-name }}
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe the published Agent runtime
        shell: bash
        run: |
          set -euo pipefail
          actual="$(docker run --rm "${IMAGE_NAME}@${IMAGE_DIGEST}" version)"
          test "${actual}" = "${AGENT_VERSION}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign and verify the image
        shell: bash
        run: |
          set -euo pipefail
          immutable_reference="${IMAGE_NAME}@${IMAGE_DIGEST}"
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release-agent.yml@refs/tags/${GITHUB_REF_NAME}"
          cosign sign --yes "${immutable_reference}"
          cosign verify \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${immutable_reference}" >/dev/null

      - name: Prepare signed release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/initpad-agent-release"
          sbom_source="${RUNNER_TEMP}/initpad-agent-sbom-source.json"
          docker buildx imagetools inspect "${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --format '{{ json .SBOM }}' > "${sbom_source}"
          node scripts/prepare-agent-release.mjs \
            --output "${release_dir}" \
            --tag "${GITHUB_REF_NAME}" \
            --image "${IMAGE_NAME}" \
            --digest "${IMAGE_DIGEST}" \
            --commit "${GITHUB_SHA}" \
            --repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --sbom "${sbom_source}"
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release-agent.yml@refs/tags/${GITHUB_REF_NAME}"
          for asset in \
            "${release_dir}/initpad-agent-install.sh" \
            "${release_dir}/initpad-agent-host-acceptance.sh" \
            "${release_dir}/initpad-agent-release.json" \
            "${release_dir}/initpad-agent-sbom.json" \
            "${release_dir}/SHA256SUMS"; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "${asset}"
            cosign verify-blob \
              --bundle "${asset}.sigstore.json" \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "${asset}" >/dev/null
          done
          echo "directory=${release_dir}" >> "${GITHUB_OUTPUT}"

      - name: Add GitHub image provenance when supported
        if: ${{ github.event.repository.visibility == 'public' || vars.INITPAD_ENABLE_PRIVATE_ATTESTATIONS == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: Add GitHub release-asset provenance when supported
        if: ${{ github.event.repository.visibility == 'public' || vars.INITPAD_ENABLE_PRIVATE_ATTESTATIONS == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ steps.assets.outputs.directory }}/SHA256SUMS

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DIRECTORY: ${{ steps.assets.outputs.directory }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" "${RELEASE_DIRECTORY}"/* \
            --verify-tag \
            --prerelease \
            --title "InitPad Agent ${AGENT_VERSION}" \
            --generate-notes
          {
            echo '## InitPad Agent release'
            echo
            echo "\`${IMAGE_NAME}@${IMAGE_DIGEST}\`"
            echo
            echo 'The OCI image and every downloadable asset were signed with the release workflow identity.'
            echo
            echo 'The release starts as a candidate prerelease. Promote it only after the host acceptance gate passes.'
          } >> "${GITHUB_STEP_SUMMARY}"
