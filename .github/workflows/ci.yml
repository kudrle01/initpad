name: Verify repository

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: repository-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, test and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan complete Git history for secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a \
            git --redact --no-banner --log-opts="--all" .

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository release gate
        run: npm run check:release

      - name: Validate self-hosted Compose configuration
        working-directory: deploy
        env:
          INITPAD_INSTALL_ROOT: ${{ github.workspace }}
          INITPAD_SUPERVISOR_SHARED_SECRET: ci-only-supervisor-secret-000000000000
        run: |
          mkdir -p .runtime/platform-update
          printf 'services: {}\n' > .runtime/platform-update/platform-release.override.yml
          docker compose --env-file .env.example config --quiet
