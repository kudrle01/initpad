name: Verify repository

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: repository-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, test and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository release gate
        run: npm run check:release

      - name: Validate self-hosted Compose configuration
        working-directory: deploy
        env:
          INITPAD_INSTALL_ROOT: ${{ github.workspace }}
          INITPAD_SUPERVISOR_SHARED_SECRET: ci-only-supervisor-secret-000000000000
        run: |
          mkdir -p .runtime/platform-update
          printf 'services: {}\n' > .runtime/platform-update/platform-release.override.yml
          docker compose --env-file .env.example config --quiet
