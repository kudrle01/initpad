name: Verify repository

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  # The dependency audit must also fail when an advisory is published for an
  # unchanged lockfile.
  schedule:
    - cron: '7 4 * * *'
  workflow_dispatch:

concurrency:
  group: repository-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The job name is the required check of the main ruleset; keep it stable.
    name: Build, test and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan complete Git history for secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a \
            git --redact --no-banner --log-opts="--all" .

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up age for the encrypted backup test
        uses: ./.github/actions/setup-age

      - name: Install locked dependencies
        run: npm ci

      # Deterministic and offline: the same gate CONTRIBUTING asks for locally.
      - name: Run repository gate
        run: npm run check

      - name: Validate self-hosted Compose configuration
        run: npm run check:compose

      # The advisory database changes without a change in this repository, so
      # the audit runs on main and nightly instead of making pull requests
      # depend on the network state of the moment.
      - name: Audit production dependencies
        if: github.event_name != 'pull_request'
        run: npm run audit:dependencies
