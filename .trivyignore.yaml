# Accepted findings of the container and template vulnerability scan (ADR-144).
# Every entry names the affected files, says why the finding cannot be reached
# and expires: after `expired_at` Trivy reports the finding again and the scan
# fails. Remove an entry as soon as the fixed release is pinned.
vulnerabilities:
  # Compose in the Supervisor image vendors golang.org/x/net 0.60.0 (fixed in
  # 0.62.0). As of 13 November 2026 neither Compose 5.7.1 nor docker/compose
  # main has the fix. Remove once a Docker CLI image ships it.
  - id: CVE-2026-78661
    paths:
      - usr/local/libexec/docker/cli-plugins/docker-compose
    statement: Denial of service through crafted HTML in x/net/html; Compose never parses HTML.
    expired_at: 2026-11-27
